<!-- Journal Settings: icon_book with the shared settings cog tucked into the bottom-right corner,
     the same badge icon_bell_cog wears. The book is drawn smaller than icon_book's so the cog sits
     in cleared space rather than over the pages — a badge that overlaps needs a knockout fill, and
     a fill would only be right on the white card these rows happen to sit on today. -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M3 4.5A2.5 2.5 0 0 1 5.5 2H12.5A.5.5 0 0 1 13 2.5v13.5a.5.5 0 0 1-.5.5H5.5A2.5 2.5 0 0 1 3 14V4.5Z" stroke="#1884DC" stroke-width="2" stroke-linejoin="round"/>
  <path d="M3 14A2.5 2.5 0 0 1 5.5 11.5H13" stroke="#1884DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cog badge: a lighter weight than the glyph beside it, so it reads as a qualifier on the
       subject rather than as a second subject. -->
  <circle cx="18.7" cy="18.7" r="2.3" stroke="#1884DC" stroke-width="1.5"/>
  <path d="M21.8 18.7h1.1M20.25 21.39l.55.95M17.15 21.39l-.55.95M15.6 18.7h-1.1M17.15 16.01l-.55-.95M20.25 16.01l.55-.95" stroke="#1884DC" stroke-width="1.5" stroke-linecap="round"/>
</svg>
