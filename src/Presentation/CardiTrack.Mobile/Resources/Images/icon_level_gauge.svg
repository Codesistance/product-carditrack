<!-- Levels to watch: the caregiver's own thresholds, directly under Alert Settings. A gauge
     rather than a bell: the row is about a level on a dial that somebody chose, not about the
     alert that follows, which the bell above already stands for. Same 2px stroke as the other
     row glyphs, needle set two-thirds round so it reads as "a level", not "empty" or "full". -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M4 17a8 8 0 0 1 16 0" stroke="#1884DC" stroke-width="2" stroke-linecap="round"/>
  <path d="M12 17l4.6-5.4" stroke="#1884DC" stroke-width="2" stroke-linecap="round"/>
  <circle cx="12" cy="17" r="1.4" fill="#1884DC"/>
  <path d="M4 20.5h16" stroke="#1884DC" stroke-width="2" stroke-linecap="round"/>
</svg>
