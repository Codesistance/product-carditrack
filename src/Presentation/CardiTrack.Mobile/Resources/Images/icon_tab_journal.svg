<!-- A written page, which is what a day review is. Same 24-unit box, #939DAA stroke and 2-unit
     weight as the other unselected tab glyphs, so the four read as one set. The three rules are
     unequal on purpose: an even three reads as a form, a short last line reads as prose. -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="5" y="3" width="14" height="18" rx="2.5" stroke="#939DAA" stroke-width="2"/>
  <path d="M9 8.5h6" stroke="#939DAA" stroke-width="2" stroke-linecap="round"/>
  <path d="M9 12.5h6" stroke="#939DAA" stroke-width="2" stroke-linecap="round"/>
  <path d="M9 16.5h3" stroke="#939DAA" stroke-width="2" stroke-linecap="round"/>
</svg>
