<!-- icon_chatbot.svg without its antenna tip and heartbeat trace: the chat greeting draws those
     on top so they can move (MemberChatPage greeting, EcgTraceView). Keep the two files in step. -->
<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headGrad" x1="44" y1="66" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36C09B"/>
      <stop offset="0.5" stop-color="#1884DC"/>
      <stop offset="1" stop-color="#174E86"/>
    </linearGradient>
  </defs>

  <!-- Antenna -->
  <line x1="120" y1="64" x2="120" y2="40" stroke="#1884DC" stroke-width="7" stroke-linecap="round"/>

  <!-- Side pods -->
  <rect x="24" y="106" width="14" height="48" rx="7" fill="#174E86"/>
  <rect x="202" y="106" width="14" height="48" rx="7" fill="#174E86"/>

  <!-- Head -->
  <rect x="42" y="64" width="156" height="132" rx="34" fill="url(#headGrad)"/>

  <!-- Circuit accents (echoing the logo's network) -->
  <g stroke="#9FEBFF" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
    <path d="M150 78L166 86L182 80"/>
    <path d="M166 86L172 100"/>
    <path d="M60 174L72 166L88 172"/>
  </g>
  <g fill="#B9F1FF" opacity="0.7">
    <circle cx="150" cy="78" r="3"/>
    <circle cx="166" cy="86" r="3.6"/>
    <circle cx="182" cy="80" r="3"/>
    <circle cx="172" cy="100" r="3"/>
    <circle cx="60" cy="174" r="3"/>
    <circle cx="88" cy="172" r="3"/>
  </g>

  <!-- Screen -->
  <rect x="62" y="94" width="116" height="72" rx="18" fill="#123A5F"/>
</svg>
