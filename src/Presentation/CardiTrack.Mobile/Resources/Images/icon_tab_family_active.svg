<!-- Figma has no Family glyph (its bar is Home/Health/Alerts/Profile), so the selected state
     reuses the same outline as icon_tab_family.svg with the tab-bar gradient on the stroke.
     A designed filled glyph would match the Home/Alerts tabs more closely — see issue #67. -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="8.5" cy="8" r="3.5" stroke="url(#tabFamilyActiveGradient)" stroke-width="2"/>
  <circle cx="16.5" cy="9.5" r="2.5" stroke="url(#tabFamilyActiveGradient)" stroke-width="2"/>
  <path d="M2.5 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="url(#tabFamilyActiveGradient)" stroke-width="2" stroke-linecap="round"/>
  <path d="M15.5 14.5c2.9 0 5 2.2 5 5.5" stroke="url(#tabFamilyActiveGradient)" stroke-width="2" stroke-linecap="round"/>
  <defs>
    <linearGradient id="tabFamilyActiveGradient" x1="2.5" y1="12" x2="20.5" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#174E86"/>
      <stop offset="0.458145" stop-color="#1884DC"/>
      <stop offset="1" stop-color="#36C09B"/>
    </linearGradient>
  </defs>
</svg>
