  <rect x="4" y="2" width="16" height="20" rx="3.5" fill="#1884DC"/>
  <path d="M9 8.5h6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M9 12.5h6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M9 16.5h3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
</svg>
