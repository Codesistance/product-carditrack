<!-- Your Alarms: the caregiver's own thresholds, directly under Alert Settings. The bell keeps the
     subject the two rows share; the badge is what tells them apart. Alert Settings wears a cog
     (the rules CardiTrack applies); this wears a level marker, a line with a knob set along it,
     because an alarm here is a level somebody chose by hand. Bell drawn at icon_bell_cog's size so
     the badge has the same cleared corner. -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M8.8 3a4.6 4.6 0 0 0-4.6 4.6v2.9l-1.2 2.4A.8.8 0 0 0 3.7 14.1h10.2a.8.8 0 0 0 .7-1.2L13.4 10.5V7.6A4.6 4.6 0 0 0 8.8 3Z" stroke="#1884DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M7.1 15.9a1.7 1.7 0 0 0 3.4 0" stroke="#1884DC" stroke-width="2" stroke-linecap="round"/>

  <!-- Level badge: a track with the knob set two-thirds along, the same lighter weight as the
       cog so it reads as a qualifier, not a second subject. -->
  <path d="M14.6 18.7h7.8" stroke="#1884DC" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="19.6" cy="18.7" r="2.1" fill="#FFFFFF" stroke="#1884DC" stroke-width="1.5"/>
  <path d="M19.6 14.6v1.4M19.6 21.4v1.4" stroke="#1884DC" stroke-width="1.5" stroke-linecap="round"/>
</svg>
