<!-- Medical Information. The padlock this replaces described how the notes are held rather than
     what they are, and read as "locked" — the one thing this row is not, for the caregiver who can
     open it. A cross in a rounded square is the medical mark itself, and the enclosure is what
     keeps it from reading as an "add" plus. -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="3" y="3" width="18" height="18" rx="5" stroke="#1884DC" stroke-width="2"/>
  <path d="M12 8v8M8 12h8" stroke="#1884DC" stroke-width="2" stroke-linecap="round"/>
</svg>
