<!-- Figma's bar is Home/Health/Alerts/Profile and has no Summaries glyph, so the selected state
     reuses the outline from icon_tab_summaries.svg with the tab-bar gradient on the stroke — the
     same treatment icon_tab_family_active.svg used before it. A designed filled glyph would match
     the Home/Alerts tabs more closely; see issue #67. -->
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="5" y="3" width="14" height="18" rx="2.5" stroke="url(#tabSummariesActiveGradient)" stroke-width="2"/>
  <path d="M9 8.5h6" stroke="url(#tabSummariesActiveGradient)" stroke-width="2" stroke-linecap="round"/>
  <path d="M9 12.5h6" stroke="url(#tabSummariesActiveGradient)" stroke-width="2" stroke-linecap="round"/>
  <path d="M9 16.5h3" stroke="url(#tabSummariesActiveGradient)" stroke-width="2" stroke-linecap="round"/>
  <defs>
    <linearGradient id="tabSummariesActiveGradient" x1="5" y1="12" x2="19" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#174E86"/>
      <stop offset="0.458145" stop-color="#1884DC"/>
      <stop offset="1" stop-color="#36C09B"/>
    </linearGradient>
  </defs>
</svg>
