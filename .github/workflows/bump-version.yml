name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options: [minor, major]
      notes:
        description: 'Release notes (optional)'
        required: false
        type: string

jobs:
  bump:
    name: Bump ${{ inputs.bump }} version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute next version
        id: version
        run: |
          git fetch --tags
          LATEST=$(git tag --sort=-version:refname | grep '^v[0-9]' | head -1)
          if [ -z "$LATEST" ]; then LATEST="v0.0.0"; fi
          MAJOR=$(echo ${LATEST#v} | cut -d. -f1)
          MINOR=$(echo ${LATEST#v} | cut -d. -f2)

          if [ "${{ inputs.bump }}" = "minor" ]; then
            NEXT="v${MAJOR}.$((MINOR+1)).0"
          elif [ "${{ inputs.bump }}" = "major" ]; then
            NEXT="v$((MAJOR+1)).0.0"
          fi

          echo "current=${LATEST}" >> $GITHUB_OUTPUT
          echo "next=${NEXT}" >> $GITHUB_OUTPUT
          echo "Current: ${LATEST} → Next: ${NEXT}"

      - name: Create and push tag
        env:
          NEXT: ${{ steps.version.outputs.next }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $NEXT
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git $NEXT

      - name: Create GitHub Release draft
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          NEXT_TAG: ${{ steps.version.outputs.next }}
          PREV_TAG: ${{ steps.version.outputs.current }}
          RELEASE_NOTES: ${{ inputs.notes }}
        with:
          script: |
            // Read through env, never string-interpolate ${{ }} into the script
            // body: inputs.notes is attacker-controlled by anyone who can dispatch
            // this workflow, and a backtick or ${ in it would otherwise break out
            // of the literal and execute as code with this job's contents:write token.
            const tag = process.env.NEXT_TAG;
            const prev = process.env.PREV_TAG;
            const notes = process.env.RELEASE_NOTES || '';

            let changelog = '';
            if (prev !== 'v0.0.0') {
              const { data: commits } = await github.rest.repos.compareCommitsWithBasehead({
                owner: context.repo.owner,
                repo: context.repo.repo,
                basehead: `${prev}...HEAD`
              });
              changelog = commits.commits
                .map(c => `- ${c.commit.message.split('\n')[0]} (${c.sha.slice(0,7)})`)
                .join('\n');
            } else {
              const { data: commits } = await github.rest.repos.listCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              });
              changelog = commits
                .map(c => `- ${c.commit.message.split('\n')[0]} (${c.sha.slice(0,7)})`)
                .join('\n');
            }

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body: [
                notes ? `## Notes\n${notes}\n` : '',
                `## Changes since ${prev}\n${changelog}`
              ].filter(Boolean).join('\n'),
              draft: true,
              prerelease: false
            });

            core.summary.addRaw(`### Release draft created: \`${tag}\``);
            await core.summary.write();
