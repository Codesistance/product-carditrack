name: Auto-merge

# Merges a pull request automatically once it carries the `automerge` label,
# every check on its head commit has finished successfully, and code review has
# come to rest: no review is still pending from Copilot, no reviewer is holding
# changes requested, and every review thread is resolved.
#
# Triggers:
#   - pull_request/labeled: covers the "checks already finished, label added last" case.
#   - pull_request_review/submitted: covers Copilot (or a human) posting the review
#     the PR was waiting on. Reviews submitted by an app use that app's own token,
#     not this workflow's GITHUB_TOKEN, so they are delivered rather than suppressed
#     by the recursion guard.
#   - schedule: resolving a review thread fires no workflow event at all
#     (pull_request_review_thread is a webhook event, not an Actions trigger), so a
#     periodic sweep is the only way to notice that the last thread went resolved.
#     It re-evaluates every open PR carrying the label. workflow_dispatch runs the
#     same sweep on demand. Note GitHub disables scheduled workflows after 60 days
#     of repository inactivity.
#   - workflow_run/completed: covers the "label added first, checks finish later" case.
#     GitHub does not deliver check_suite events for suites created by Actions
#     (recursion guard), so each PR-triggered workflow must be listed by name here.
#     Add any new PR-triggered workflow to this list or auto-merge will not fire
#     when it is the last check to finish. Apps-dev and infra still belong here:
#     when ACTIONS_ON_PUSH is 1 they run on the PR; when it is 0 they skip and
#     this trigger is a no-op.
#
# Note: AUTOMERGE_TOKEN (fine-grained PAT or GitHub App token with
# contents:write + pull-requests:write) is preferred so Copilot review can be
# requested and so a merge still triggers other workflows. The job falls back
# to GITHUB_TOKEN when the secret is absent (merge still works; Copilot request
# and push-triggered workflows may not). Push-to-main deploys run only when
# ACTIONS_ON_PUSH is 1/true (see .github/ACTIONS_ON_PUSH); otherwise dispatch
# CI / Deploy Apps → Dev.

on:
  pull_request:
    types: [labeled]
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'CI / Deploy Apps → Dev'
      - 'Deploy Infrastructure → Dev'
      - 'Deploy Infrastructure → Common'
      - 'Request Copilot review'
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  auto-merge:
    name: auto-merge
    # Label names here must match AUTOMERGE_LABEL below (env is not available in job-level if).
    if: github.event_name != 'pull_request' || github.event.label.name == 'automerge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        env:
          AUTOMERGE_LABEL: automerge
          # Check runs belonging to this job are excluded from the "all checks
          # passed" evaluation; must match the job name above.
          OWN_JOB_NAME: auto-merge
        with:
          github-token: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const label = process.env.AUTOMERGE_LABEL;
            const ownJob = process.env.OWN_JOB_NAME;

            // GraphQL reports the reviewer as a Bot node whose login has no '[bot]'
            // suffix; REST reports 'copilot-pull-request-reviewer[bot]'. Strip the
            // suffix so either spelling matches.
            const COPILOT_REVIEWER = 'copilot-pull-request-reviewer';
            const normalizeLogin = login => (login || '').replace(/\[bot\]$/, '').toLowerCase();

            // reviewRequests holds only reviewers who have not yet submitted, so a
            // PR that was never sent to Copilot is not blocked, while a re-review
            // requested after new commits blocks again.
            const REVIEW_STATE_QUERY = `
              query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    reviewRequests(first: 100) {
                      nodes {
                        requestedReviewer {
                          __typename
                          ... on Bot { login }
                          ... on User { login }
                        }
                      }
                    }
                    latestReviews(first: 100) {
                      nodes { state author { login } }
                    }
                    reviewThreads(first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes { isResolved }
                    }
                  }
                }
              }`;

            async function getReviewState(prNumber) {
              let cursor = null;
              let firstPage = true;
              let copilotPending = false;
              let changesRequestedBy = [];
              let unresolvedThreads = 0;

              do {
                const { repository } = await github.graphql(REVIEW_STATE_QUERY, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  number: prNumber,
                  cursor,
                });
                const gqlPr = repository.pullRequest;

                if (firstPage) {
                  copilotPending = gqlPr.reviewRequests.nodes.some(
                    node => normalizeLogin(node.requestedReviewer?.login) === COPILOT_REVIEWER
                  );
                  changesRequestedBy = gqlPr.latestReviews.nodes
                    .filter(review => review.state === 'CHANGES_REQUESTED')
                    .map(review => review.author?.login || 'unknown');
                  firstPage = false;
                }

                unresolvedThreads += gqlPr.reviewThreads.nodes.filter(t => !t.isResolved).length;
                const { hasNextPage, endCursor } = gqlPr.reviewThreads.pageInfo;
                cursor = hasNextPage ? endCursor : null;
              } while (cursor);

              return { copilotPending, changesRequestedBy, unresolvedThreads };
            }

            let prNumbers;
            if (context.eventName === 'workflow_run') {
              // Empty for fork PRs; those are not auto-merged.
              prNumbers = (context.payload.workflow_run.pull_requests || []).map(pr => pr.number);
            } else if (context.payload.pull_request) {
              prNumbers = [context.payload.pull_request.number];
            } else {
              // schedule / workflow_dispatch: sweep every open PR carrying the label.
              const openPrs = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              prNumbers = openPrs
                .filter(pr => pr.labels.some(l => l.name === label))
                .map(pr => pr.number);
            }
            if (prNumbers.length === 0) {
              core.info('No same-repo pull requests to evaluate; nothing to do.');
              return;
            }

            for (const prNumber of prNumbers) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });

              if (pr.state !== 'open' || pr.draft) {
                core.info(`#${prNumber} is ${pr.draft ? 'a draft' : pr.state}; skipping.`);
                continue;
              }
              if (!pr.labels.some(l => l.name === label)) {
                core.info(`#${prNumber} does not carry the '${label}' label; skipping.`);
                continue;
              }
              if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                core.info(`#${prNumber} is from a fork; skipping.`);
                continue;
              }

              // Review must have come to rest before checks are even considered:
              // green CI on unreviewed or unaddressed code is exactly what this guards.
              const review = await getReviewState(prNumber);
              if (review.copilotPending) {
                core.info(`#${prNumber}: Copilot review still pending; skipping.`);
                continue;
              }
              if (review.changesRequestedBy.length > 0) {
                core.info(`#${prNumber}: changes requested by ${review.changesRequestedBy.join(', ')}; skipping.`);
                continue;
              }
              if (review.unresolvedThreads > 0) {
                core.info(`#${prNumber}: ${review.unresolvedThreads} unresolved review thread(s); skipping.`);
                continue;
              }

              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
                per_page: 100,
              });
              const otherRuns = checkRuns.filter(run => run.name !== ownJob);

              const pending = otherRuns.filter(run => run.status !== 'completed');
              if (pending.length > 0) {
                core.info(`#${prNumber}: still waiting on ${pending.map(r => r.name).join(', ')}.`);
                continue;
              }
              const failed = otherRuns.filter(run => !['success', 'neutral', 'skipped'].includes(run.conclusion));
              if (failed.length > 0) {
                core.info(`#${prNumber}: not merging — failed checks: ${failed.map(r => `${r.name} (${r.conclusion})`).join(', ')}.`);
                continue;
              }

              // Legacy commit statuses (non-Actions integrations). With zero
              // statuses the combined state reads 'pending', hence the count guard.
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: pr.head.sha,
              });
              if (combined.total_count > 0 && combined.state !== 'success') {
                core.info(`#${prNumber}: combined commit status is '${combined.state}'; skipping.`);
                continue;
              }

              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  merge_method: 'merge',
                  // Refuse to merge if the branch moved since the checks were evaluated.
                  sha: pr.head.sha,
                });
                core.notice(`Merged #${prNumber}.`);
              } catch (error) {
                // Typically a merge conflict, or another run merged it first.
                core.warning(`Could not merge #${prNumber}: ${error.message}`);
              }
            }
