name: Deploy Mobile → Dev

# Pushes an already-built release to the stores. It does not build: the signed
# AAB and IPA come from the GCS builds bucket, where CI / Deploy Apps → Dev
# archives them under the release tag it created (tick mobile_android /
# mobile_ios there). Pushing costs about two Linux minutes per platform and
# never touches a Mac.
#
#   gh workflow run deploy-mobile-dev.yml --ref main -f platform=android            # newest tag with an AAB
#   gh workflow run deploy-mobile-dev.yml --ref main -f platform=ios -f tag=v0.2.308
#
# Dispatch on main only. The bucket keeps a tag's builds for 10 days; after
# that the tag has to be rebuilt before it can be pushed.
#
# Pushing is idempotent per store. A store that already holds the tag's build
# is skipped there, the platform still counts as delivered, and the run ends
# green — so a run that lost one platform can be dispatched again for `both`
# and only the missing store is uploaded. The skip needs the tag's build number
# to be the one recorded for it at build time, which is a function of the tag
# alone; a legacy tag on the commit-count fallback keeps the clash behaviour,
# since another tag minted on the same commit shares that count and the store
# cannot say which of them it holds. On TestFlight "holds" means a build
# that is VALID or still PROCESSING, and delivery is confirmed by waiting for
# VALID; a build that failed processing has spent its number and fails the run
# like a store holding a *higher* number does: nothing lower can ever land.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        type: choice
        options:
          - android
          - ios
          - both
        default: both
      tag:
        description: 'Release tag (v1.2.3). Empty = the newest v* tag whose builds for the platform are in the bucket.'
        type: string
        default: ''

permissions:
  id-token: write
  contents: read

# Never cancel a run that may be mid-upload to a store; a second dispatch
# queues behind the first instead.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  env:
    name: Environment
    uses: ./.github/workflows/_env.yml

  # ── Which tag, which platforms, and are its builds there? ──────────────────
  resolve:
    name: Resolve tag and platforms
    needs: env
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      tag:          ${{ steps.tag.outputs.tag }}
      build_number: ${{ steps.tag.outputs.build_number }}
      build_number_recorded: ${{ steps.tag.outputs.build_number_recorded }}
      android:      ${{ steps.platforms.outputs.android }}
      ios:          ${{ steps.platforms.outputs.ios }}
      # 'true' when that store already holds the tag's build: its push job is
      # skipped and dispatch-sanity counts the platform as delivered.
      play_already:       ${{ steps.stores.outputs.play_already }}
      testflight_already: ${{ steps.stores.outputs.testflight_already }}
      ios_bundle_id:      ${{ steps.bundle.outputs.bundle_id }}
      changelog_testflight: ${{ steps.changelog.outputs.changelog_testflight }}
      changelog_play:       ${{ steps.changelog.outputs.changelog_play }}
      gcp_project_id:      ${{ needs.env.outputs.gcp_project_id }}
      gcp_wif_provider:    ${{ needs.env.outputs.gcp_wif_provider }}
      gcp_service_account: ${{ needs.env.outputs.gcp_service_account }}
      gcs_builds_bucket:   ${{ needs.env.outputs.gcs_builds_bucket }}
    steps:
      - name: Main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy Mobile → Dev pushes main's builds to the stores; dispatch it on main (got ${{ github.ref }})."
          exit 1

      - id: platforms
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          ANDROID=false; IOS=false
          case "$PLATFORM" in
            android) ANDROID=true ;;
            ios)     IOS=true ;;
            both)    ANDROID=true; IOS=true ;;
            *) echo "::error::Unknown platform '$PLATFORM'"; exit 1 ;;
          esac
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "ios=$IOS"         >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install 'pyjwt[crypto]==2.13.0'

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ needs.env.outputs.gcp_wif_provider }}
          service_account: ${{ needs.env.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      # An explicit tag must carry every requested platform's build. With no tag
      # given, the newest v* tag that does is used — CI / Deploy Apps → Dev tags
      # API-only and Android-only runs too, so "newest tag" alone would often
      # name one with nothing to push.
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          BUCKET: gs://${{ needs.env.outputs.gcs_builds_bucket }}
          ANDROID: ${{ steps.platforms.outputs.android }}
          IOS: ${{ steps.platforms.outputs.ios }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          has_builds() {  # $1 = tag; prints the platforms missing for it
            local missing="" listing
            # Capture first, then grep: under pipefail a `grep -q` that exits early
            # can SIGPIPE gcloud and turn a present build into a "missing" one.
            if [ "$ANDROID" = "true" ]; then
              listing=$(gcloud storage ls "$BUCKET/$1/android/**" 2>/dev/null || true)
              printf '%s\n' "$listing" | grep -q '\-Signed\.aab$' || missing="$missing android"
            fi
            if [ "$IOS" = "true" ]; then
              listing=$(gcloud storage ls "$BUCKET/$1/ios/**" 2>/dev/null || true)
              printf '%s\n' "$listing" | grep -q '\.ipa$' || missing="$missing ios"
            fi
            printf '%s' "$missing"
          }
          TAG="$(printf '%s' "$INPUT_TAG" | tr -d '[:space:]')"
          if [ -n "$TAG" ]; then
            # Same release-tag contract as deploy-apps-prod.yml: only vMAJOR.MINOR.PATCH.
            printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Tag '$TAG' is not a release tag (expected vMAJOR.MINOR.PATCH)."; exit 1; }
            git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::Tag '$TAG' does not exist."; exit 1; }
            MISSING=$(has_builds "$TAG")
            if [ -n "$MISSING" ]; then
              echo "::error::No signed build for $TAG in $BUCKET for:$MISSING. Build it first — dispatch CI / Deploy Apps → Dev on main with the mobile_android / mobile_ios ticks — then push. The bucket keeps builds for 10 days; an older tag has to be rebuilt."
              exit 1
            fi
          else
            # Candidates come from the bucket itself — only tags that still have a
            # folder there can qualify (10-day lifecycle) — newest release first.
            # Captured before filtering so no pipeline status can abort the step.
            FOLDERS=$(gcloud storage ls "$BUCKET/" 2>/dev/null || true)
            CANDIDATES=$(printf '%s\n' "$FOLDERS" | sed -n 's|^.*/\(v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)/$|\1|p' | sort -rV || true)
            for CANDIDATE in $CANDIDATES; do
              git rev-parse -q --verify "refs/tags/$CANDIDATE" >/dev/null || continue
              if [ -z "$(has_builds "$CANDIDATE")" ]; then TAG="$CANDIDATE"; break; fi
            done
            [ -n "$TAG" ] || { echo "::error::No release tag in $BUCKET has signed builds for the requested platform(s). Dispatch CI / Deploy Apps → Dev on main with the mobile_android / mobile_ios ticks first (the bucket keeps builds for 10 days)."; exit 1; }
            echo "Newest tag with the requested builds: $TAG"
          fi
          # The build number CI stamped into the binaries. It is archived beside them,
          # because this side has to push the number that is actually in the binary
          # rather than work it out again — two sides deriving it independently is how
          # they came to disagree. Tags archived before build-number.txt existed carry
          # the commit count the old scheme used, so that stays the fallback.
          BUILD_NUMBER=$(gcloud storage cat "$BUCKET/$TAG/build-number.txt" 2>/dev/null | tr -cd '[:digit:]' || true)
          RECORDED=true
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$(git rev-list --count "$TAG")
            RECORDED=false
            echo "$TAG was archived before build numbers were recorded — using its commit count ($BUILD_NUMBER)."
          fi
          echo "tag=$TAG"                   >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          # A recorded number is a function of the tag alone, so a store holding it
          # holds this tag's build. A commit count is not: the store check needs to
          # know which it has before it treats a held number as delivered.
          echo "build_number_recorded=$RECORDED" >> "$GITHUB_OUTPUT"
          PRESENT=""; [ "$ANDROID" = "true" ] && PRESENT="$PRESENT android"; [ "$IOS" = "true" ] && PRESENT="$PRESENT ios"
          echo "Pushing $TAG (build $BUILD_NUMBER):$PRESENT"

      # The bundle id the IPA carries, read at the tag being pushed: an older tag's
      # project may not match today's main. The store check below and the
      # TestFlight job both use it — that job runs main's scripts, not the tag's,
      # so it cannot read the csproj off its own checkout.
      #
      # Captured before being filtered, and the filter tolerated: under pipefail a
      # `head -1` that exits early can SIGPIPE sed and abort the step. An unreadable
      # bundle id costs the TestFlight check and notes, which is reported there.
      - name: Bundle id at the tag
        id: bundle
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -uo pipefail
          CSPROJ=$(git show "$TAG:src/Presentation/CardiTrack.Mobile/CardiTrack.Mobile.csproj" 2>/dev/null || true)
          BUNDLE_ID=$(printf '%s\n' "$CSPROJ" | sed -n 's|.*<ApplicationId>\(.*\)</ApplicationId>.*|\1|p' | head -1 || true)
          [ -n "$BUNDLE_ID" ] || echo "::warning::No ApplicationId in $TAG's mobile csproj."
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"

      # Ask the stores before uploading anything. A build number a store has already
      # seen is spent for the life of the app, and the only way this workflow used to
      # find out was by uploading and being refused — once per platform, after the
      # binary had been sent. That is what happened on 2026-09-18: the resolve step
      # selected a tag that had already shipped, and both stores rejected build 1524.
      #
      # This runs before the tag is checked out below, because the script only exists
      # on main; an older tag would not carry it.
      #
      # A store that already holds this very build is not a failure either: an
      # earlier run delivered it (2026-09-21: Play took 20329, then the TestFlight
      # step died waiting on an expired token after its binary had shipped). That
      # store's upload is skipped and the run stays green, so dispatching again for
      # `both` uploads only what is missing. On App Store Connect only a VALID or
      # PROCESSING build counts as held — one that FAILED processing never reaches
      # TestFlight, but its number is spent, so it lands in the clash branch below.
      #
      # A store that cannot be reached is not a veto. The upload step still refuses a
      # duplicate, so a momentary API failure warns and lets the run continue rather
      # than blocking a release that would have been fine.
      - name: Stores do not already have this build
        id: stores
        env:
          PROJECT: ${{ needs.env.outputs.gcp_project_id }}
          TAG: ${{ steps.tag.outputs.tag }}
          BUILD_NUMBER: ${{ steps.tag.outputs.build_number }}
          ANDROID: ${{ steps.platforms.outputs.android }}
          IOS: ${{ steps.platforms.outputs.ios }}
          BUNDLE_ID: ${{ steps.bundle.outputs.bundle_id }}
          RECORDED: ${{ steps.tag.outputs.build_number_recorded }}
        run: |
          set -uo pipefail
          KEYS="$RUNNER_TEMP/store-preflight"
          rm -rf "$KEYS"; mkdir -p "$KEYS"; chmod 700 "$KEYS"
          trap 'rm -rf "$KEYS"' EXIT

          secret() { gcloud secrets versions access latest --secret="$1" --project="$PROJECT" 2>/dev/null || true; }
          populated() { [ -n "$1" ] && [ "$1" != "REPLACE_ME" ]; }

          # Nothing is assumed delivered until a store says so; set here so the
          # outputs exist even when a check below is skipped or cannot be made.
          echo "play_already=false"       >> "$GITHUB_OUTPUT"
          echo "testflight_already=false" >> "$GITHUB_OUTPUT"

          CLASH=0
          # $1 = store name, $2 = the unit it calls the number, $3 = the output that
          # marks the store delivered, $4 = the script's answer (highest=N, holds=true|false)
          verdict() {
            local highest holds
            highest=$(printf '%s\n' "$4" | sed -n 's/^highest=//p')
            holds=$(printf '%s\n' "$4" | sed -n 's/^holds=//p')
            if [ "$holds" = "true" ] && [ "$RECORDED" = "true" ]; then
              echo "::notice::$1 already holds $2 $BUILD_NUMBER from $TAG — nothing to upload, so its push is skipped."
              echo "$3=true" >> "$GITHUB_OUTPUT"
              echo "### $1 — already holds \`$TAG\` ($2 $BUILD_NUMBER); upload skipped" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$holds" = "true" ]; then
              # The number is a commit count, which another tag minted on the same
              # commit shares; the store cannot say whose build it has, and the
              # number is spent either way.
              echo "::error::$1 already holds $2 $BUILD_NUMBER, but $TAG's number is a commit count rather than one recorded for the tag, and a commit count is not unique to a tag — the store may hold another tag's build under it. Build a new tag (dispatch CI / Deploy Apps → Dev on main with the mobile_android / mobile_ios ticks) and push that instead."
              CLASH=1
            elif [ "${highest:-0}" -ge "$BUILD_NUMBER" ]; then
              echo "::error::$1 has already seen $2 $highest, at or above the $BUILD_NUMBER that $TAG would upload — it will be refused as a duplicate, and nothing lower can ever land. Either $TAG's build predates the current numbering, or an earlier upload of it failed processing and spent the number. Build a new tag (dispatch CI / Deploy Apps → Dev on main with the mobile_android / mobile_ios ticks) and push that instead."
              CLASH=1
            else
              echo "$1 holds $2 ${highest:-0}; $TAG uploads $BUILD_NUMBER."
            fi
          }

          if [ "$ANDROID" = "true" ]; then
            PLAY_KEY=$(secret carditrack-common-play-service-account-key)
            if populated "$PLAY_KEY"; then
              printf '%s' "$PLAY_KEY" > "$KEYS/play.json"
              # The package name the upload step uses, stated the same way it states it.
              ANSWER=$(python .github/scripts/mobile-store-build-numbers.py \
                --platform android \
                --package-name com.codesistance.carditrack.mobile \
                --play-key-file "$KEYS/play.json" \
                --build "$BUILD_NUMBER") && OK=0 || OK=$?
              if [ "$OK" -eq 0 ]; then verdict "Play Console" versionCode play_already "$ANSWER"; else
                echo "::warning::Could not ask Play Console what it holds; the upload step will still refuse a duplicate."
              fi
            else
              echo "::warning::Play Console secret not populated — skipping its duplicate check."
            fi
          fi

          if [ "$IOS" = "true" ]; then
            ISSUER=$(secret carditrack-common-appstore-connect-issuer-id)
            KEY_ID=$(secret carditrack-common-appstore-connect-api-key-id)
            PRIVATE_KEY=$(secret carditrack-common-appstore-connect-api-private-key)
            if populated "$ISSUER" && populated "$KEY_ID" && populated "$PRIVATE_KEY"; then
              printf '%s' "$PRIVATE_KEY" > "$KEYS/appstore.p8"
              if [ -n "$BUNDLE_ID" ]; then
                ANSWER=$(python .github/scripts/mobile-store-build-numbers.py \
                  --platform ios \
                  --bundle-id "$BUNDLE_ID" \
                  --issuer-id "$ISSUER" \
                  --key-id "$KEY_ID" \
                  --private-key-file "$KEYS/appstore.p8" \
                  --build "$BUILD_NUMBER") && OK=0 || OK=$?
                if [ "$OK" -eq 0 ]; then verdict "App Store Connect" build testflight_already "$ANSWER"; else
                  echo "::warning::Could not ask App Store Connect what it holds; the upload step will still refuse a duplicate."
                fi
              else
                echo "::warning::No ApplicationId in $TAG's mobile csproj — skipping the TestFlight duplicate check."
              fi
            else
              echo "::warning::App Store Connect secrets not populated — skipping its duplicate check."
            fi
          fi

          exit $CLASH

      # Same "What's new" the builds used to carry: commits since the previous
      # v* tag, up to this tag — so the checkout moves to the tag first.
      - name: Release notes
        id: changelog
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          BUILD_NUMBER: ${{ steps.tag.outputs.build_number }}
        run: |
          set -euo pipefail
          git checkout --quiet "$TAG"
          # The previous release: the highest v* tag that is an ancestor of this one.
          SINCE=""
          for CANDIDATE in $(git tag --sort=-version:refname | grep '^v[0-9]' | grep -vx "$TAG"); do
            if git merge-base --is-ancestor "$CANDIDATE" "$TAG"; then SINCE="$CANDIDATE"; break; fi
          done
          [ -n "$SINCE" ] || SINCE=v0.0.0
          echo "Changelog since $SINCE"
          python3 .github/scripts/mobile-build-changelog.py \
            --since "$SINCE" \
            --version "$TAG" \
            --build "$BUILD_NUMBER" \
            --testflight-out /tmp/changelog-testflight.txt \
            --play-out /tmp/changelog-play.txt
          TF_DELIM="TF_CHANGELOG_EOF_$(openssl rand -hex 8)"
          PLAY_DELIM="PLAY_CHANGELOG_EOF_$(openssl rand -hex 8)"
          {
            echo "changelog_testflight<<${TF_DELIM}"
            cat /tmp/changelog-testflight.txt
            echo "${TF_DELIM}"
            echo "changelog_play<<${PLAY_DELIM}"
            cat /tmp/changelog-play.txt
            echo "${PLAY_DELIM}"
          } >> "$GITHUB_OUTPUT"

  # ── Play Console (internal track) ───────────────────────────────────────────
  deploy-play-internal:
    name: Deploy → Play Console (internal)
    needs: resolve
    # Skipped outright when Play already holds the build — a re-run after a lost
    # platform, or a tag pushed twice. Play's release notes travel with the upload,
    # so there is nothing left to do for a build that is already there.
    if: needs.resolve.outputs.android == 'true' && needs.resolve.outputs.play_already != 'true'
    runs-on: ubuntu-latest
    # 'skipped' when the secret gate closed, 'failure' when the store rejected
    # it: dispatch-sanity reads this rather than the job's green tick.
    outputs:
      pushed: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ needs.resolve.outputs.gcp_wif_provider }}
          service_account: ${{ needs.resolve.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Check Play Console secrets
        id: gate
        env:
          PROJECT: ${{ needs.resolve.outputs.gcp_project_id }}
        run: |
          SECRET=carditrack-common-play-service-account-key
          VALUE=$(gcloud secrets versions access latest --secret="$SECRET" --project="$PROJECT" 2>/dev/null || true)
          if [ -z "$VALUE" ] || [ "$VALUE" = "REPLACE_ME" ]; then
            echo "::warning::Skipping Play Console upload — $SECRET not populated"
            echo "### Play Console upload skipped" >> $GITHUB_STEP_SUMMARY
            echo "Populate \`$SECRET\` in Secret Manager to enable Play Console uploads." >> $GITHUB_STEP_SUMMARY
            echo "available=false" >> $GITHUB_OUTPUT
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3
        if: steps.gate.outputs.available == 'true'
        id: secrets
        with:
          secrets: |
            play_key:${{ needs.resolve.outputs.gcp_project_id }}/carditrack-common-play-service-account-key

      - name: Download the build from GCS
        if: steps.gate.outputs.available == 'true'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          BUCKET: gs://${{ needs.resolve.outputs.gcs_builds_bucket }}
        run: |
          mkdir -p artifacts/android
          # ** — the AAB sits below publish/ inside the archive, and a single * does not cross /.
          gcloud storage cp -r "$BUCKET/$TAG/android/**" artifacts/android/

      - name: Find AAB
        id: aab
        if: steps.gate.outputs.available == 'true'
        run: |
          echo "path=$(find artifacts/android -name '*-Signed.aab' | head -1)" >> $GITHUB_OUTPUT
          echo "mapping=$(find artifacts/android -name 'mapping.txt' | head -1)" >> $GITHUB_OUTPUT
          echo "symbols=$(find artifacts/android -name 'native-debug-symbols.zip' | head -1)" >> $GITHUB_OUTPUT

      - name: Write Play release notes
        if: steps.gate.outputs.available == 'true'
        env:
          NOTES: ${{ needs.resolve.outputs.changelog_play }}
        run: |
          mkdir -p play-whatsnew
          printf '%s' "$NOTES" > play-whatsnew/whatsnew-en-US
          printf '%s' "$NOTES" > play-whatsnew/whatsnew-en-GB

      - name: Upload to Play Console (internal track)
        id: upload
        if: steps.gate.outputs.available == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ steps.secrets.outputs.play_key }}
          packageName: com.codesistance.carditrack.mobile
          releaseFiles: ${{ steps.aab.outputs.path }}
          mappingFile: ${{ steps.aab.outputs.mapping }}
          debugSymbols: ${{ steps.aab.outputs.symbols }}
          tracks: internal
          status: completed
          whatsNewDirectory: play-whatsnew

      - name: Summary
        if: steps.gate.outputs.available == 'true'
        env:
          NOTES: ${{ needs.resolve.outputs.changelog_play }}
        run: |
          echo "### Play Console (internal) — uploaded \`${{ needs.resolve.outputs.tag }}\` (versionCode ${{ needs.resolve.outputs.build_number }})" >> $GITHUB_STEP_SUMMARY
          echo >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          printf '%s\n' "$NOTES" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── TestFlight ──────────────────────────────────────────────────────────────
  deploy-testflight:
    name: Deploy → TestFlight
    needs: resolve
    if: needs.resolve.outputs.ios == 'true'
    runs-on: ubuntu-latest
    # Delivered means App Store Connect has processed the build to VALID — the
    # upload alone is not it (a duplicate number or a rejected binary fails
    # processing after a successful upload). Read by dispatch-sanity.
    outputs:
      delivered: ${{ steps.processed.outcome == 'success' }}
    steps:
      # First on purpose: checkout wipes untracked files from the workspace, so
      # anything it runs after loses its output — the downloaded IPA, and the
      # gha-creds-*.json the auth step leaves there for every later gcloud call.
      # Only here for .github/scripts/testflight-release-notes.py, at the revision
      # this workflow runs from: an older tag being re-pushed would otherwise run
      # its own, older copy. The tag's bundle id comes from the resolve job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install 'pyjwt[crypto]==2.13.0'

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ needs.resolve.outputs.gcp_wif_provider }}
          service_account: ${{ needs.resolve.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Check App Store Connect API secrets
        id: gate
        env:
          PROJECT: ${{ needs.resolve.outputs.gcp_project_id }}
        run: |
          MISSING=""
          for SECRET in carditrack-common-appstore-connect-issuer-id carditrack-common-appstore-connect-api-key-id carditrack-common-appstore-connect-api-private-key; do
            VALUE=$(gcloud secrets versions access latest --secret="$SECRET" --project="$PROJECT" 2>/dev/null || true)
            if [ -z "$VALUE" ] || [ "$VALUE" = "REPLACE_ME" ]; then MISSING="$MISSING $SECRET"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::Skipping TestFlight upload — secrets not populated:$MISSING"
            echo "### TestFlight upload skipped" >> $GITHUB_STEP_SUMMARY
            echo "Populate$MISSING in Secret Manager to enable TestFlight uploads." >> $GITHUB_STEP_SUMMARY
            echo "available=false" >> $GITHUB_OUTPUT
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3
        if: steps.gate.outputs.available == 'true'
        id: secrets
        with:
          secrets: |
            issuer_id:${{ needs.resolve.outputs.gcp_project_id }}/carditrack-common-appstore-connect-issuer-id
            api_key_id:${{ needs.resolve.outputs.gcp_project_id }}/carditrack-common-appstore-connect-api-key-id
            api_private_key:${{ needs.resolve.outputs.gcp_project_id }}/carditrack-common-appstore-connect-api-private-key

      # The IPA is only fetched when it is going to be uploaded. When TestFlight
      # already holds the build, the job still runs — to put the release notes on
      # a build whose first run died before reaching that step — but uploads nothing.
      - name: Download the build from GCS
        if: steps.gate.outputs.available == 'true' && needs.resolve.outputs.testflight_already != 'true'
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          BUCKET: gs://${{ needs.resolve.outputs.gcs_builds_bucket }}
        run: |
          mkdir -p artifacts/ios
          # ** for the same reason as the Android download; the symbols zips come along, harmlessly.
          gcloud storage cp -r "$BUCKET/$TAG/ios/**" artifacts/ios/

      - name: Find IPA
        id: ipa
        if: steps.gate.outputs.available == 'true' && needs.resolve.outputs.testflight_already != 'true'
        run: echo "path=$(find artifacts/ios -name '*.ipa' | head -1)" >> $GITHUB_OUTPUT

      # release-notes is deliberately not passed. The action attaches them by
      # editing a beta build localization App Store Connect has already created,
      # polls ten minutes for one, and fails the step when none appears — which
      # is what a build gets before Test Information exists, and what sank a run
      # whose binary had already shipped.
      #
      # wait-for-processing is off for the same shape of reason: the action signs
      # one token with a ten-minute life and polls with backoff past it, so a
      # build that takes longer than that to be listed (20329 took over thirteen
      # minutes on 2026-09-21) ends in a 401 after the binary is safely uploaded.
      # The step therefore ends at the upload, and its outcome means the binary
      # and nothing else. Processing is waited on in the next step instead, on
      # tokens that refresh as they age; the changelog goes on there too.
      - name: Upload to TestFlight
        id: upload
        if: steps.gate.outputs.available == 'true' && needs.resolve.outputs.testflight_already != 'true'
        uses: apple-actions/upload-testflight-build@1fc69ca369a60b813eaaa2d936eda22794b52e17 # v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ steps.secrets.outputs.issuer_id }}
          api-key-id: ${{ steps.secrets.outputs.api_key_id }}
          api-private-key: ${{ steps.secrets.outputs.api_private_key }}
          wait-for-processing: false

      # Waits for App Store Connect to list and process the build. This is the
      # step that decides delivery: a build that ends FAILED or INVALID — a
      # duplicate number, or a binary Apple rejects — or is not VALID within the
      # deadline fails the job here, and dispatch-sanity reads this step's outcome.
      # Runs after a skipped upload as well, so a build the store already held is
      # confirmed processed rather than assumed.
      - name: Wait for App Store Connect to process the build
        id: processed
        if: steps.gate.outputs.available == 'true'
        env:
          BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          BUNDLE_ID: ${{ needs.resolve.outputs.ios_bundle_id }}
          ISSUER_ID: ${{ steps.secrets.outputs.issuer_id }}
          API_KEY_ID: ${{ steps.secrets.outputs.api_key_id }}
          API_PRIVATE_KEY: ${{ steps.secrets.outputs.api_private_key }}
        run: |
          set -uo pipefail
          [ -n "$BUNDLE_ID" ] || { echo "::error::The tag's mobile csproj has no ApplicationId, so the build cannot be looked up on App Store Connect."; exit 1; }
          KEY_FILE="$RUNNER_TEMP/appstore-connect.p8"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$API_PRIVATE_KEY" > "$KEY_FILE"
          # `python`, not `python3`: the setup-python interpreter above is the
          # one holding PyJWT.
          python .github/scripts/testflight-release-notes.py \
            --bundle-id "$BUNDLE_ID" \
            --build "$BUILD_NUMBER" \
            --issuer-id "$ISSUER_ID" \
            --key-id "$API_KEY_ID" \
            --private-key-file "$KEY_FILE"

      # Writes the changelog testers see as TestFlight "What to Test". Best effort:
      # a build on TestFlight without its changelog is a worse build, not a failed
      # deploy — the step still goes red in the log, and Summary says so. After a
      # skipped upload this is what a re-run is for: notes the dead first run never
      # attached. The build is VALID by now, so the wait here is only index lag.
      - name: Attach release notes
        id: notes
        if: steps.gate.outputs.available == 'true'
        continue-on-error: true
        env:
          NOTES: ${{ needs.resolve.outputs.changelog_testflight }}
          BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          BUNDLE_ID: ${{ needs.resolve.outputs.ios_bundle_id }}
          ISSUER_ID: ${{ steps.secrets.outputs.issuer_id }}
          API_KEY_ID: ${{ steps.secrets.outputs.api_key_id }}
          API_PRIVATE_KEY: ${{ steps.secrets.outputs.api_private_key }}
        run: |
          KEY_FILE="$RUNNER_TEMP/appstore-connect.p8"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$API_PRIVATE_KEY" > "$KEY_FILE"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.txt"
          python .github/scripts/testflight-release-notes.py \
            --bundle-id "$BUNDLE_ID" \
            --build "$BUILD_NUMBER" \
            --notes-file "$RUNNER_TEMP/notes.txt" \
            --wait-minutes 5 \
            --issuer-id "$ISSUER_ID" \
            --key-id "$API_KEY_ID" \
            --private-key-file "$KEY_FILE"

      - name: Summary
        if: steps.gate.outputs.available == 'true'
        env:
          NOTES: ${{ needs.resolve.outputs.changelog_testflight }}
          TAG: ${{ needs.resolve.outputs.tag }}
          BUILD_NUMBER: ${{ needs.resolve.outputs.build_number }}
          ALREADY: ${{ needs.resolve.outputs.testflight_already }}
          NOTES_OUTCOME: ${{ steps.notes.outcome }}
        run: |
          if [ "$ALREADY" = "true" ]; then
            echo "### TestFlight — already held \`$TAG\` (build $BUILD_NUMBER), now processed; upload skipped, release notes refreshed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### TestFlight — uploaded and processed \`$TAG\` (build $BUILD_NUMBER)" >> $GITHUB_STEP_SUMMARY
          fi
          echo >> $GITHUB_STEP_SUMMARY
          if [ "$NOTES_OUTCOME" != "success" ]; then
            echo "::warning::Build $BUILD_NUMBER is on App Store Connect, but its release notes did not attach."
            echo "Release notes did not attach — testers see this build without them:" >> $GITHUB_STEP_SUMMARY
            echo >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY
          printf '%s\n' "$NOTES" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ── Did the run push what was asked for? ────────────────────────────────────
  # A push job goes green when its secret gate closes (nothing uploaded, by
  # design, with a warning). That is fine for a build; it is not fine for a
  # workflow whose only job is the upload. Fail the run instead — unless the
  # store already held the build, which is the one way "nothing uploaded" and
  # "delivered" are the same thing.
  dispatch-sanity:
    name: Dispatch pushed something
    needs: [resolve, deploy-play-internal, deploy-testflight]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESOLVE: ${{ needs.resolve.result }}
          ANDROID: ${{ needs.resolve.outputs.android }}
          IOS: ${{ needs.resolve.outputs.ios }}
          PLAY_PUSHED: ${{ needs.deploy-play-internal.outputs.pushed }}
          TF_DELIVERED: ${{ needs.deploy-testflight.outputs.delivered }}
          PLAY_ALREADY: ${{ needs.resolve.outputs.play_already }}
          TF_ALREADY: ${{ needs.resolve.outputs.testflight_already }}
        run: |
          set -euo pipefail
          if [ "$RESOLVE" != "success" ]; then
            echo "::error::'Resolve tag and platforms' was $RESOLVE — nothing was pushed."
            exit 1
          fi
          FAIL=0
          if [ "$ANDROID" = "true" ]; then
            if [ "$PLAY_ALREADY" = "true" ]; then
              echo "Android: Play Console already held this build — nothing to push."
            elif [ "$PLAY_PUSHED" = "true" ]; then
              echo "Android: pushed to Play Console."
            else
              echo "::error::Android was requested but nothing reached Play Console (secret gate closed, or the upload failed)."; FAIL=1
            fi
          fi
          # iOS is judged on App Store Connect having processed the build, whether
          # this run uploaded it or found it already there: an upload that then
          # fails processing never reaches TestFlight.
          if [ "$IOS" = "true" ]; then
            if [ "$TF_DELIVERED" != "true" ]; then
              echo "::error::iOS was requested but TestFlight has no processed build (secret gate closed, the upload failed, or App Store Connect rejected or did not finish processing it)."; FAIL=1
            elif [ "$TF_ALREADY" = "true" ]; then
              echo "iOS: TestFlight already held this build, and it is processed — nothing to push."
            else
              echo "iOS: pushed to TestFlight and processed."
            fi
          fi
          exit $FAIL
