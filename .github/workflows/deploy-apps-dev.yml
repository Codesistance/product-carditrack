  deploy-pipeline-dev:
    name: Deploy Pipeline Jobs → Dev
    # Same schema-before-code gate as deploy-web-dev — see the comment there. PipelineJobs
    # queries through the same EF model (its #209-window errors were the EF retry wrapper
    # around the same missing table).
    needs: [changes, push-pipeline-image, run-db-migrations]
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.pipeline == 'true'
      && needs.push-pipeline-image.result == 'success'
      && (needs.run-db-migrations.result == 'success' || needs.run-db-migrations.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      # jobs update, not run deploy: the job resources are Terraform-owned (VPC, Cloud SQL,
      # secrets, args) and only their image is CI-owned; Cloud Scheduler drives executions.
      # All three jobs share the image and differ by container args.
      - run: |
          gcloud run jobs update carditrack-dev-pipeline-jobs \
            --image ${{ needs.push-pipeline-image.outputs.image }} \
            --region ${{ needs.changes.outputs.gcp_region }} \
            --project ${{ needs.changes.outputs.gcp_project_id }} \
            --quiet
          gcloud run jobs update carditrack-dev-pipeline-jobs-aggregator \
            --image ${{ needs.push-pipeline-image.outputs.image }} \
            --region ${{ needs.changes.outputs.gcp_region }} \
            --project ${{ needs.changes.outputs.gcp_project_id }} \
            --quiet
          gcloud run jobs update carditrack-dev-pipeline-jobs-assessor \
            --image ${{ needs.push-pipeline-image.outputs.image }} \
            --region ${{ needs.changes.outputs.gcp_region }} \
            --project ${{ needs.changes.outputs.gcp_project_id }} \
            --quiet

  # ── MedGemma ─────────────────────────────────────────────────────────────────
  build-and-push-medgemma:
    name: Build & Push MedGemma Image
    needs: [changes, compute-version]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.medgemma == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ needs.changes.outputs.gcp_region }}-docker.pkg.dev --quiet
      - name: Read model version
        id: model
        run: echo "tag=$(cat src/Infrastructure/MedGemma/.model-version | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Build and push
        env:
          IMAGE: ${{ needs.changes.outputs.registry }}/medgemma
          TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          docker build \
            --build-arg MODEL_TAG=${{ steps.model.outputs.tag }} \
            -t $IMAGE:$TAG \
            -f src/Infrastructure/MedGemma/Dockerfile .
          docker push $IMAGE:$TAG
          docker tag $IMAGE:$TAG $IMAGE:stable
          docker push $IMAGE:stable
          echo "image=$IMAGE:$TAG" >> $GITHUB_OUTPUT
        id: push
      - name: Resolve image
        id: resolve
        env:
          IMAGE: ${{ needs.changes.outputs.registry }}/medgemma
        run: echo "image=$IMAGE:${{ needs.compute-version.outputs.version }}" >> $GITHUB_OUTPUT

  deploy-medgemma-dev:
    name: Deploy MedGemma → Dev
    needs: [changes, build-and-push-medgemma]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.medgemma == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy MedGemma service
        env:
          SERVICE: carditrack-dev-medgemma
          IMAGE: ${{ needs.build-and-push-medgemma.outputs.image }}
          REGION: ${{ needs.changes.outputs.gcp_region }}
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE \
            --region $REGION \
            --project $PROJECT \
            --quiet
      - name: Update MedGemma URL secret
        env:
          SERVICE: carditrack-dev-medgemma
          SECRET_ID: carditrack-dev-medgemma-service-url
          REGION: ${{ needs.changes.outputs.gcp_region }}
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
          # Active versions to retain, newest first. Every consumer binds version = "latest"
          # (deployments/cloud_run.tf), so only the newest is ever read; the spare exists so an
          # operator can read back the previous URL after a bad deploy.
          KEEP_VERSIONS: "2"
        run: |
          URL=$(gcloud run services describe $SERVICE \
            --region $REGION \
            --project $PROJECT \
            --format='value(status.url)')

          # A Cloud Run service URL is stable across deploys, so writing unconditionally added a
          # byte-identical version on every MedGemma deploy. Secret Manager bills per active
          # version, so that was pure cost — and it also overwrote the rollback spare with a
          # duplicate. Compare first, write only on a real change.
          CURRENT=$(gcloud secrets versions access latest \
            --secret=$SECRET_ID \
            --project $PROJECT 2>/dev/null || true)

          if [ "$CURRENT" = "$URL" ]; then
            echo "MedGemma URL unchanged ($URL) — no new secret version added."
          else
            echo -n "$URL" | gcloud secrets versions add $SECRET_ID \
              --data-file=- \
              --project $PROJECT
            echo "MedGemma URL set to $URL."
          fi

          # Destroy superseded versions. Terraform cannot do this: the version it manages carries
          # ignore_changes = [secret_data], and versions written by this step were never in its
          # state. Destroy is irreversible, but safe for anything past the newest — nothing pins a
          # version number, every binding resolves "latest". Cleanup failure must not fail the
          # deploy, so each destroy degrades to a warning.
          #
          # The listing is captured rather than piped straight into the loop. Piped, a failure here
          # is invisible: the step runs under bash -e without pipefail, so the pipeline takes the
          # exit status of the while loop, which succeeds happily over the empty input a failed
          # list produces. The deploy would carry on — correctly — but silently, and this step's
          # whole job is to stop versions accumulating unnoticed.
          if ! SUPERSEDED=$(gcloud secrets versions list $SECRET_ID \
                --project $PROJECT \
                --filter='state=ENABLED' \
                --sort-by=~createTime \
                --format='value(name.basename())'); then
            echo "::warning::Could not list versions of $SECRET_ID; skipping prune this run."
            SUPERSEDED=""
          fi

          echo "$SUPERSEDED" \
            | tail -n +"$((KEEP_VERSIONS + 1))" \
            | while read -r VERSION; do
                [ -n "$VERSION" ] || continue
                echo "Destroying superseded version $VERSION of $SECRET_ID."
                gcloud secrets versions destroy "$VERSION" \
                  --secret=$SECRET_ID \
                  --project $PROJECT \
                  --quiet \
                  || echo "::warning::Could not destroy version $VERSION of $SECRET_ID."
              done

  # ── Main only: Create patch tag ──────────────────────────────────────────────
  patch-tag:
    name: Create Patch Tag
    needs:
      - changes
      - compute-version
      - deploy-api-dev
      - deploy-web-dev
      - deploy-worker-dev
      - deploy-medgemma-dev
      - upload-mobile-artifacts
      - deploy-testflight
      - deploy-play-internal
    permissions:
      contents: write
    # compute-version must have *succeeded*, not merely not-failed. It is gated on api/web/worker/
    # mobile having changed, so an infrastructure- or docs-only merge to main skips it — and
    # `contains(needs.*.result, 'success')` was still satisfied by `changes` alone, so this job ran
    # anyway with an empty version and asked the API to create `refs/tags/`, which is a 422. The
    # 2026-08-13 #239 merge was the first infra-only merge to reach main and failed exactly there.
    #
    # Nothing was mis-deployed when that happened: every build and deploy job had skipped for the
    # same reason compute-version did, so the tag was the only casualty. But it fails the whole
    # run, so an infra merge looks broken.
    if: |
      always() &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.compute-version.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # Tag via the REST API, not `git push`: receive-pack rejects any ref
      # update whose commit touches .github/workflows/* unless the credential
      # has the `workflows` scope — which GITHUB_TOKEN can never be granted.
      # The create-ref endpoint skips that check because it uploads nothing:
      # it just names a commit that already exists on main. No checkout needed.
      - name: Create tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${{ github.sha }}"
          echo "### Tagged: \`$TAG\`" >> $GITHUB_STEP_SUMMARY
