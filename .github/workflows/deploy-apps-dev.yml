name: CI / Deploy Apps → Dev

# Push/PR CI is gated by .github/ACTIONS_ON_PUSH (0/false off, 1/true on).
# workflow_dispatch always runs. See docs/technical/github_repository_access.md.
#
# Mobile is not here. It is its own dispatch-only workflow, deploy-mobile-dev.yml,
# with the platform as an input — see the header there.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      api:
        description: 'API'
        type: boolean
        default: true
      web:
        description: 'Web'
        type: boolean
        default: true
      worker:
        description: 'Worker'
        type: boolean
        default: true
      pipeline:
        description: 'Pipeline jobs'
        type: boolean
        default: true
      webhook:
        description: 'Webhook receiver'
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── ACTIONS_ON_PUSH flag (0/false skips the rest on push and pull_request) ──
  #
  # Runs on workflow_dispatch too, even though `env` below ignores its answer there. That is not
  # redundancy: a skipped job poisons the whole chain beneath it, past any `always()` in between.
  # This job was originally skipped on workflow_dispatch, `env` survived that skip via `always()`
  # and succeeded — and `changes`, whose only dependency was that successful `env` and which
  # carries no `if:` of its own, was skipped anyway, taking all 36 downstream jobs with it. The
  # run reported success having built and deployed nothing, which is the worst way to fail.
  # So: never skip the root of the chain. Fifteen seconds of checkout-and-parse on a manual run
  # is the price of a dependency graph with nothing skipped in it.
  actions-on-push:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/_actions-on-push.yml

  # ── Shared config (single source of truth via _env.yml) ─────────────────────
  env:
    needs: [actions-on-push]
    if: >-
      always()
      && !cancelled()
      && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (github.event_name == 'workflow_dispatch' || needs.actions-on-push.outputs.enabled == 'true')
    uses: ./.github/workflows/_env.yml

  # ── Detect changed paths ─────────────────────────────────────────────────────
  # Also passes env outputs through so all downstream jobs get them
  # via needs.changes.outputs.* without needing an explicit env dependency.
  changes:
    name: Detect changes
    needs: env
    runs-on: ubuntu-latest
    # paths-filter reads the PR's file list from GET /repos/:o/:r/pulls/:n/files,
    # which needs pull-requests:read. The workflow-level grant does not carry it,
    # so every PR run failed with "Resource not accessible by integration".
    # Scoped here rather than widened at the top: no other job calls that API,
    # and this job needs no id-token.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api:            ${{ steps.manual.outputs.api      || steps.filter.outputs.api }}
      web:            ${{ steps.manual.outputs.web      || steps.filter.outputs.web }}
      worker:         ${{ steps.manual.outputs.worker   || steps.filter.outputs.worker }}
      pipeline:       ${{ steps.manual.outputs.pipeline || steps.filter.outputs.pipeline }}
      webhook:        ${{ steps.manual.outputs.webhook  || steps.filter.outputs.webhook }}
      dotnet_version:      ${{ needs.env.outputs.dotnet_version }}
      registry:            ${{ needs.env.outputs.registry }}
      gcp_project_id:      ${{ needs.env.outputs.gcp_project_id }}
      gcp_region:          ${{ needs.env.outputs.gcp_region }}
      gcp_wif_provider:    ${{ needs.env.outputs.gcp_wif_provider }}
      gcp_service_account: ${{ needs.env.outputs.gcp_service_account }}
      api_url_dev:         ${{ needs.env.outputs.api_url_dev }}
      web_url_dev:         ${{ needs.env.outputs.web_url_dev }}
    steps:
      - uses: actions/checkout@v6
      - name: Set components for manual run
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: |
          echo "api=${{ inputs.api }}"           >> $GITHUB_OUTPUT
          echo "web=${{ inputs.web }}"           >> $GITHUB_OUTPUT
          echo "worker=${{ inputs.worker }}"     >> $GITHUB_OUTPUT
          echo "pipeline=${{ inputs.pipeline }}" >> $GITHUB_OUTPUT
          echo "webhook=${{ inputs.webhook }}"   >> $GITHUB_OUTPUT
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            api:
              - '.github/workflows/deploy-apps-dev.yml'
              - '.github/workflows/deploy-apps-prod.yml'
              - 'src/Presentation/CardiTrack.API/**'
              - 'src/Core/**'
              - 'src/Infrastructure/**'
              - 'tests/**'
              - 'CardiTrack.sln'
            web:
              - '.github/workflows/deploy-apps-dev.yml'
              - '.github/workflows/deploy-apps-prod.yml'
              - 'src/Presentation/CardiTrack.Web/**'
              - 'src/Core/**'
              - 'src/Infrastructure/**'
              - 'CardiTrack.sln'
            worker:
              - '.github/workflows/deploy-apps-dev.yml'
              - '.github/workflows/deploy-apps-prod.yml'
              - 'src/Worker/**'
              - 'src/Core/**'
              - 'src/Infrastructure/**'
              - 'tests/**'
              - 'CardiTrack.sln'
            pipeline:
              - '.github/workflows/deploy-apps-dev.yml'
              - '.github/workflows/deploy-apps-prod.yml'
              - 'src/Pipeline/CardiTrack.PipelineJobs/**'
              - 'src/Core/**'
              - 'src/Infrastructure/**'
              - 'CardiTrack.sln'
            webhook:
              - '.github/workflows/deploy-apps-dev.yml'
              - '.github/workflows/deploy-apps-prod.yml'
              - 'src/Pipeline/CardiTrack.HealthWebhookReceiver/**'
              - 'src/Infrastructure/CardiTrack.Observability/**'
              - 'src/Infrastructure/CardiTrack.Shared/**'
              - 'CardiTrack.sln'

  # ── Compute next semver (main only) ─────────────────────────────────────────
  compute-version:
    name: Compute next version
    needs: changes
    # Every lane that stamps the version into an image or artifact belongs in this condition —
    # a lane missing here makes its whole chain skip silently on a dispatch that enables only
    # that lane, while the run still reports success (issue #409: a model-only dispatch
    # built and deployed nothing, twice, before anyone noticed).
    if: |
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.api      == 'true' ||
       needs.changes.outputs.web      == 'true' ||
       needs.changes.outputs.worker   == 'true' ||
       needs.changes.outputs.pipeline == 'true' ||
       needs.changes.outputs.webhook  == 'true')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compute patch bump
        id: version
        run: |
          git fetch --tags
          LATEST=$(git tag --sort=-version:refname | grep '^v[0-9]' | head -1 || true)
          if [ -z "$LATEST" ]; then LATEST="v0.0.0"; fi
          MAJOR=$(echo ${LATEST#v} | cut -d. -f1)
          MINOR=$(echo ${LATEST#v} | cut -d. -f2)
          PATCH=$(echo ${LATEST#v} | cut -d. -f3)
          NEXT="v${MAJOR}.${MINOR}.$((PATCH+1))"
          echo "version=${NEXT}" >> $GITHUB_OUTPUT
          echo "Next version: ${NEXT}"

  # ── API ─────────────────────────────────────────────────────────────────────
  build-api:
    name: Build API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - run: dotnet restore src/Presentation/CardiTrack.API/CardiTrack.API.csproj
      - run: dotnet build src/Presentation/CardiTrack.API/CardiTrack.API.csproj -c Release --no-restore

  # Tests and the migration check compile what they need themselves, so they gate
  # on `changes` rather than `build-api` — chaining only delayed them behind a
  # duplicate build. push-api-image still requires all of them to succeed.
  test-unit:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - run: dotnet restore tests/CardiTrack.UnitTests/CardiTrack.UnitTests.csproj
      - run: |
          dotnet test tests/CardiTrack.UnitTests/CardiTrack.UnitTests.csproj \
            -c Release \
            --logger trx \
            --collect:"XPlat Code Coverage"
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: unit-test-results
          path: '**/*.trx'
          retention-days: 1

  test-integration:
    name: Integration Tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - run: dotnet restore tests/CardiTrack.IntegrationTests/CardiTrack.IntegrationTests.csproj
      - run: |
          dotnet test tests/CardiTrack.IntegrationTests/CardiTrack.IntegrationTests.csproj \
            -c Release \
            --logger trx
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: integration-test-results
          path: '**/*.trx'
          retention-days: 1

  check-migrations:
    name: EF Migration Check
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - run: dotnet tool install --global dotnet-ef
      - run: dotnet restore src/Presentation/CardiTrack.API/CardiTrack.API.csproj
      - run: dotnet build src/Presentation/CardiTrack.API/CardiTrack.API.csproj -c Release --no-restore
      - name: Check for pending model changes
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/Infrastructure/CardiTrack.Infrastructure/CardiTrack.Infrastructure.csproj \
            --startup-project src/Presentation/CardiTrack.API/CardiTrack.API.csproj \
            --configuration Release \
            --no-build
        env:
          SKIP_DB_CONTEXT_VALIDATION: 'true'

  security-api:
    name: Security Scan (API)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - name: Dependency vulnerability audit
        run: |
          dotnet restore src/Presentation/CardiTrack.API/CardiTrack.API.csproj
          dotnet list src/Presentation/CardiTrack.API/CardiTrack.API.csproj package \
            --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -E "^\s+> " audit.txt | grep -qv "GHSA-rvv3-g6hj-g44x"; then
            echo "::error::Vulnerable packages detected — review audit.txt"
            exit 1
          fi

  # ── Web ─────────────────────────────────────────────────────────────────────
  build-web:
    name: Build Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - run: dotnet restore src/Presentation/CardiTrack.Web/CardiTrack.Web.csproj
      - run: dotnet build src/Presentation/CardiTrack.Web/CardiTrack.Web.csproj -c Release --no-restore

  security-web:
    name: Security Scan (Web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - name: Dependency vulnerability audit
        run: |
          dotnet restore src/Presentation/CardiTrack.Web/CardiTrack.Web.csproj
          dotnet list src/Presentation/CardiTrack.Web/CardiTrack.Web.csproj package \
            --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -E "^\s+> " audit.txt | grep -qv "GHSA-rvv3-g6hj-g44x"; then
            echo "::error::Vulnerable packages detected — review audit.txt"
            exit 1
          fi

  # ── Worker ───────────────────────────────────────────────────────────────────
  build-worker:
    name: Build Worker
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - run: dotnet restore src/Worker/CardiTrack.Worker/CardiTrack.Worker.csproj
      - run: dotnet build src/Worker/CardiTrack.Worker/CardiTrack.Worker.csproj -c Release --no-restore

  # Gates push-worker-image, and for a Worker-only change it is the *only* test job
  # that runs: the `api` path filter does not include src/Worker/**, so test-unit
  # and test-integration both skip. That made the previous `--filter
  # "Category=Worker"` actively dangerous rather than merely wasteful — no test in
  # this repo has ever carried a Category trait, so the runner reported
  #   No test matches the given testcase filter `Category=Worker`
  # and passed, and a Worker-only change shipped with zero tests executed.
  #
  # It now runs the whole unit suite (1903 tests). Filtering by name instead was
  # considered and rejected: `FullyQualifiedName~Worker` matches 15 tests, and one
  # of those only because DeviceSyncServiceTests has a method ending
  # "OnWorkerCadence" — it would drift silently as tests are renamed. When a change
  # touches both api and worker this duplicates test-unit for ~114s, which is the
  # cheaper mistake.
  test-unit-worker:
    name: Unit Tests (Worker)
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - run: dotnet restore tests/CardiTrack.UnitTests/CardiTrack.UnitTests.csproj
      - run: |
          dotnet test tests/CardiTrack.UnitTests/CardiTrack.UnitTests.csproj \
            -c Release \
            --logger trx
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: worker-test-results
          path: '**/*.trx'
          retention-days: 1

  security-worker:
    name: Security Scan (Worker)
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - name: Dependency vulnerability audit
        run: |
          dotnet restore src/Worker/CardiTrack.Worker/CardiTrack.Worker.csproj
          dotnet list src/Worker/CardiTrack.Worker/CardiTrack.Worker.csproj package \
            --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -E "^\s+> " audit.txt | grep -qv "GHSA-rvv3-g6hj-g44x"; then
            echo "::error::Vulnerable packages detected — review audit.txt"
            exit 1
          fi

  # ── Main only: Push images ───────────────────────────────────────────────────
  push-api-image:
    name: Push API Image
    needs:
      - changes
      - compute-version
      - build-api
      - test-unit
      - test-integration
      - security-api
      - check-migrations
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ needs.changes.outputs.gcp_region }}-docker.pkg.dev --quiet
      - name: Build and push
        id: push
        env:
          IMAGE: ${{ needs.changes.outputs.registry }}/api
          TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          # VERSION stamps the tag into the assembly so the running revision reports it
          # in logs and as OTel's service.version; MSBuild needs bare semver, hence ${TAG#v}
          docker build -f src/Presentation/CardiTrack.API/Dockerfile \
            --build-arg VERSION=${TAG#v} \
            -t $IMAGE:$TAG \
            .
          docker push $IMAGE:$TAG
          echo "image=$IMAGE:$TAG" >> $GITHUB_OUTPUT

  push-migrator-image:
    name: Push Migrator Image
    needs:
      - changes
      - compute-version
      - build-api
      - test-unit
      - test-integration
      - security-api
      - check-migrations
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ needs.changes.outputs.gcp_region }}-docker.pkg.dev --quiet
      - name: Build and push
        id: push
        env:
          IMAGE: ${{ needs.changes.outputs.registry }}/migrator
          TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          docker build -f src/Presentation/CardiTrack.API/Dockerfile.migrate \
            --build-arg VERSION=${TAG#v} \
            -t $IMAGE:$TAG \
            .
          docker push $IMAGE:$TAG
          echo "image=$IMAGE:$TAG" >> $GITHUB_OUTPUT

  push-web-image:
    name: Push Web Image
    needs:
      - changes
      - compute-version
      - build-web
      - security-web
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ needs.changes.outputs.gcp_region }}-docker.pkg.dev --quiet
      - name: Build and push
        id: push
        env:
          IMAGE: ${{ needs.changes.outputs.registry }}/web
          TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          docker build -f src/Presentation/CardiTrack.Web/Dockerfile \
            --build-arg VERSION=${TAG#v} \
            -t $IMAGE:$TAG \
            .
          docker push $IMAGE:$TAG
          echo "image=$IMAGE:$TAG" >> $GITHUB_OUTPUT

  push-worker-image:
    name: Push Worker Image
    needs:
      - changes
      - compute-version
      - build-worker
      - test-unit-worker
      - security-worker
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ needs.changes.outputs.gcp_region }}-docker.pkg.dev --quiet
      - name: Build and push
        id: push
        env:
          IMAGE: ${{ needs.changes.outputs.registry }}/worker
          TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          docker build -f src/Worker/CardiTrack.Worker/Dockerfile \
            --build-arg VERSION=${TAG#v} \
            -t $IMAGE:$TAG \
            .
          docker push $IMAGE:$TAG
          echo "image=$IMAGE:$TAG" >> $GITHUB_OUTPUT

  push-pipeline-image:
    name: Push Pipeline Jobs Image
    needs:
      - changes
      - compute-version
      - test-unit
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ needs.changes.outputs.gcp_region }}-docker.pkg.dev --quiet
      - name: Build and push
        id: push
        env:
          IMAGE: ${{ needs.changes.outputs.registry }}/pipeline-jobs
          TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          docker build -f src/Pipeline/CardiTrack.PipelineJobs/Dockerfile \
            --build-arg VERSION=${TAG#v} \
            -t $IMAGE:$TAG \
            .
          docker push $IMAGE:$TAG
          echo "image=$IMAGE:$TAG" >> $GITHUB_OUTPUT

  push-webhook-image:
    name: Push Webhook Receiver Image
    needs:
      - changes
      - compute-version
      - test-unit
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.webhook == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ needs.changes.outputs.gcp_region }}-docker.pkg.dev --quiet
      - name: Build and push
        id: push
        env:
          IMAGE: ${{ needs.changes.outputs.registry }}/webhook-receiver
          TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          docker build -f src/Pipeline/CardiTrack.HealthWebhookReceiver/Dockerfile \
            --build-arg VERSION=${TAG#v} \
            -t $IMAGE:$TAG \
            .
          docker push $IMAGE:$TAG
          echo "image=$IMAGE:$TAG" >> $GITHUB_OUTPUT

  # ── Main only: DB Migrations + Deploy Dev ───────────────────────────────────
  run-db-migrations:
    name: DB Migrations (Dev)
    needs: [changes, push-migrator-image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Update migrator job image
        env:
          JOB: carditrack-dev-api-migrator
          IMAGE: ${{ needs.push-migrator-image.outputs.image }}
          REGION: ${{ needs.changes.outputs.gcp_region }}
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          gcloud run jobs update $JOB \
            --image $IMAGE \
            --region $REGION \
            --project $PROJECT \
            --quiet
      - name: Execute migrations
        env:
          JOB: carditrack-dev-api-migrator
          REGION: ${{ needs.changes.outputs.gcp_region }}
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          gcloud run jobs execute $JOB \
            --wait \
            --region $REGION \
            --project $PROJECT

  deploy-api-dev:
    name: Deploy API → Dev
    needs: [changes, push-api-image, run-db-migrations]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      # The app refuses to start without a valid key, so an unseeded secret would fail
      # the revision with an opaque container-startup error. Fail here with a usable one.
      - name: Verify encryption key is seeded
        env:
          SECRET_ID: carditrack-dev-encryption-key
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          VALUE=$(gcloud secrets versions access latest --secret="$SECRET_ID" --project="$PROJECT" 2>/dev/null || true)
          # Strip whitespace and compare case-insensitively, matching the app's own
          # placeholder handling. Any placeholder would fail the length check below
          # regardless — normalising just gets the actionable message instead.
          TRIMMED=$(printf '%s' "$VALUE" | tr -d '[:space:]')
          if [ -z "$TRIMMED" ] || [ "$(printf '%s' "$TRIMMED" | tr '[:lower:]' '[:upper:]')" = "REPLACE_ME" ]; then
            echo "::error::$SECRET_ID is not seeded. Set it to a base64-encoded 256-bit key: openssl rand -base64 32 | gcloud secrets versions add $SECRET_ID --project=$PROJECT --data-file=-"
            exit 1
          fi
          LEN=$(printf '%s' "$TRIMMED" | base64 -d 2>/dev/null | wc -c | tr -d '[:space:]' || true)
          if [ "$LEN" != "32" ]; then
            echo "::error::$SECRET_ID must be a base64-encoded 256-bit key (32 bytes decoded); it decodes to $LEN bytes."
            exit 1
          fi
      - name: Deploy
        run: |
          gcloud run deploy carditrack-dev-api \
            --image ${{ needs.push-api-image.outputs.image }} \
            --region ${{ needs.changes.outputs.gcp_region }} \
            --project ${{ needs.changes.outputs.gcp_project_id }} \
            --add-cloudsql-instances carditrack-490120:europe-west2:carditrack-dev-sql \
            --quiet
      - name: Smoke test
        env:
          SECRET_ID: carditrack-dev-health-token
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          HEALTH_TOKEN=$(gcloud secrets versions access latest \
            --secret="$SECRET_ID" \
            --project="$PROJECT")
          # Cloud Run marks a revision Ready as soon as its first instance passes the
          # startup probe, then scales out the rest of min-instances concurrently. A
          # request landing on one of those still-cold instances right after rollout
          # fails with a platform-level 500 ("the instance could not start
          # successfully") even though the app itself never errored. Retry through
          # that window instead of failing the deploy on a single unlucky request.
          for attempt in 1 2 3 4 5; do
            # `|| echo "000"` keeps a connect/DNS/TLS failure from tripping this
            # step's `set -e` and aborting before the loop gets to retry — curl's
            # own non-zero exit would otherwise propagate straight through the
            # `STATUS=$(...)` assignment.
            # `|| STATUS=000` outside the substitution, not `|| echo 000` inside it: curl still
            # writes its -w output on failure, so the inner form concatenates both into "000000".
            # Harmless here — the 200 test fails either way — but it makes the logged status a
            # lie, which is the sort of thing that costs an hour during an incident.
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              -H "X-Health-Token: $HEALTH_TOKEN" \
              -A "carditrack-healthcheck" \
              "${{ needs.changes.outputs.api_url_dev }}/health") || STATUS="000"
            [ "$STATUS" = "200" ] && break
            echo "Health check attempt $attempt: HTTP $STATUS"
            [ "$attempt" = "5" ] || sleep 5
          done
          [ "$STATUS" = "200" ] || (echo "::error::Health check failed: HTTP $STATUS" && exit 1)

  deploy-web-dev:
    name: Deploy Web → Dev
    # Waits on run-db-migrations like every service that opens the database (Web wires the
    # DbContext too): schema-dependent code must never boot ahead of its schema. The #209
    # deploy proved the race is real — the Worker's startup pass hit a table 18 seconds
    # before the migrator created it. Migrations may legitimately be SKIPPED here (a change
    # that touches no src/Infrastructure path cannot contain a migration, but flips e.g.
    # web without api) — hence success-or-skipped rather than plain job ordering.
    # !cancelled() is what makes GitHub evaluate this condition at all when a needed job
    # was skipped; it also removes the implicit success() on the other needs, so the image
    # push is re-checked explicitly.
    needs: [changes, push-web-image, run-db-migrations]
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.web == 'true'
      && needs.push-web-image.result == 'success'
      && (needs.run-db-migrations.result == 'success' || needs.run-db-migrations.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: |
          gcloud run deploy carditrack-dev-web \
            --image ${{ needs.push-web-image.outputs.image }} \
            --region ${{ needs.changes.outputs.gcp_region }} \
            --project ${{ needs.changes.outputs.gcp_project_id }} \
            --quiet
      # Deliberately against the public domain, not the *.run.app URL. Web's ingress is
      # INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER whenever web_custom_domain is set, so the domain is
      # the only way in — and it is the whole path that broke: app.dev's DNS record was lost, its
      # managed certificate stopped renewing, and it expired on 2026-08-07. Nobody noticed for six
      # days, because this step did not exist and the deploy ended at `gcloud run deploy`, which
      # reports success as long as the revision starts.
      #
      # So this checks DNS, the certificate, Cloud Armor, the load balancer and the container in
      # one request. curl fails the step on a TLS error too (exit 35 was the symptom for those six
      # days), which a status-code-only check would have missed entirely.
      #
      # The user agent matters: Cloud Armor rejects curl's default with a 403. carditrack-healthcheck
      # is the same agent the API smoke test uses.
      - name: Smoke test
        env:
          WEB_URL: ${{ needs.changes.outputs.web_url_dev }}
        run: |
          # A smoke test with no target passes vacuously or fails confusingly, and either way
          # tests nothing. This is not hypothetical: the first version of this step shipped with
          # the changes job not forwarding web_url_dev, so WEB_URL was empty and every attempt
          # failed against "/" with no host.
          if [ -z "$WEB_URL" ]; then
            echo "::error::WEB_URL is empty — the changes job is not forwarding web_url_dev. Nothing was tested."
            exit 1
          fi

          # Cloud Run marks a revision Ready as soon as its first instance passes the startup
          # probe, then scales out the rest concurrently; a request landing on a still-cold
          # instance can 500 even though the app never errored. Retry through that window rather
          # than failing a good deploy on one unlucky request — same reasoning as the API's.
          for attempt in 1 2 3 4 5; do
            # The `|| STATUS=000` sits outside the substitution deliberately. Inside it, curl
            # still writes its -w output on failure, so `$(curl ... || echo 000)` concatenates
            # both and yields "000000" — which then matches neither the success test nor the
            # unreachable test below, and the useful diagnostic never prints.
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              -A "carditrack-healthcheck" \
              "$WEB_URL/") || STATUS="000"
            [ "$STATUS" = "200" ] && break
            echo "Web check attempt $attempt: HTTP $STATUS"
            [ "$attempt" = "5" ] || sleep 5
          done

          # 000 means curl never got a status: DNS failure, TLS failure or timeout. That is the
          # case worth naming explicitly, because it is the one that went unseen for six days.
          if [ "$STATUS" = "000" ]; then
            echo "::error::Web unreachable at $WEB_URL — no HTTP response. Check DNS resolves to the load balancer IP, and that the managed certificate is ACTIVE (gcloud compute ssl-certificates list --global)."
            exit 1
          fi
          [ "$STATUS" = "200" ] || (echo "::error::Web check failed: HTTP $STATUS" && exit 1)

  deploy-worker-dev:
    name: Deploy Worker → Dev
    # Same schema-before-code gate as deploy-web-dev — see the comment there. The Worker
    # is the service that actually lost this race on the #209 deploy (42P01 from
    # PartitionMaintenanceWorker's run-on-startup pass).
    needs: [changes, push-worker-image, run-db-migrations]
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.worker == 'true'
      && needs.push-worker-image.result == 'success'
      && (needs.run-db-migrations.result == 'success' || needs.run-db-migrations.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      # Same gate as the API — the Worker decrypts the same OAuth tokens on refresh.
      - name: Verify encryption key is seeded
        env:
          SECRET_ID: carditrack-dev-encryption-key
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          VALUE=$(gcloud secrets versions access latest --secret="$SECRET_ID" --project="$PROJECT" 2>/dev/null || true)
          # Strip whitespace and compare case-insensitively, matching the app's own
          # placeholder handling. Any placeholder would fail the length check below
          # regardless — normalising just gets the actionable message instead.
          TRIMMED=$(printf '%s' "$VALUE" | tr -d '[:space:]')
          if [ -z "$TRIMMED" ] || [ "$(printf '%s' "$TRIMMED" | tr '[:lower:]' '[:upper:]')" = "REPLACE_ME" ]; then
            echo "::error::$SECRET_ID is not seeded. Set it to a base64-encoded 256-bit key: openssl rand -base64 32 | gcloud secrets versions add $SECRET_ID --project=$PROJECT --data-file=-"
            exit 1
          fi
          LEN=$(printf '%s' "$TRIMMED" | base64 -d 2>/dev/null | wc -c | tr -d '[:space:]' || true)
          if [ "$LEN" != "32" ]; then
            echo "::error::$SECRET_ID must be a base64-encoded 256-bit key (32 bytes decoded); it decodes to $LEN bytes."
            exit 1
          fi
      - run: |
          gcloud run deploy carditrack-dev-worker \
            --image ${{ needs.push-worker-image.outputs.image }} \
            --region ${{ needs.changes.outputs.gcp_region }} \
            --project ${{ needs.changes.outputs.gcp_project_id }} \
            --add-cloudsql-instances carditrack-490120:europe-west2:carditrack-dev-sql \
            --quiet

  deploy-webhook-dev:
    name: Deploy Webhook Receiver → Dev
    needs: [changes, push-webhook-image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.webhook == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      # Image only — the service resource (SA, secret, public IAM) is Terraform-owned.
      - run: |
          gcloud run deploy carditrack-dev-webhook-receiver \
            --image ${{ needs.push-webhook-image.outputs.image }} \
            --region ${{ needs.changes.outputs.gcp_region }} \
            --project ${{ needs.changes.outputs.gcp_project_id }} \
            --quiet

  deploy-pipeline-dev:
    name: Deploy Pipeline Jobs → Dev
    # Same schema-before-code gate as deploy-web-dev — see the comment there. PipelineJobs
    # queries through the same EF model (its #209-window errors were the EF retry wrapper
    # around the same missing table).
    needs: [changes, push-pipeline-image, run-db-migrations]
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.pipeline == 'true'
      && needs.push-pipeline-image.result == 'success'
      && (needs.run-db-migrations.result == 'success' || needs.run-db-migrations.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      # jobs update, not run deploy: the job resources are Terraform-owned (VPC, Cloud SQL,
      # secrets, args) and only their image is CI-owned; Cloud Scheduler drives executions.
      # All four jobs share the image and differ by container args.
      - run: |
          gcloud run jobs update carditrack-dev-pipeline-jobs \
            --image ${{ needs.push-pipeline-image.outputs.image }} \
            --region ${{ needs.changes.outputs.gcp_region }} \
            --project ${{ needs.changes.outputs.gcp_project_id }} \
            --quiet
          gcloud run jobs update carditrack-dev-pipeline-jobs-aggregator \
            --image ${{ needs.push-pipeline-image.outputs.image }} \
            --region ${{ needs.changes.outputs.gcp_region }} \
            --project ${{ needs.changes.outputs.gcp_project_id }} \
            --quiet
          gcloud run jobs update carditrack-dev-pipeline-jobs-assessor \
            --image ${{ needs.push-pipeline-image.outputs.image }} \
            --region ${{ needs.changes.outputs.gcp_region }} \
            --project ${{ needs.changes.outputs.gcp_project_id }} \
            --quiet
          # Conditional while the themer rolls out: the job resource is Terraform-owned, so on
          # an environment where the apply hasn't run yet this step would otherwise fail the
          # whole deploy under bash -e. The skip prints, so a missing job stays visible.
          if gcloud run jobs describe carditrack-dev-pipeline-jobs-themer \
            --region ${{ needs.changes.outputs.gcp_region }} \
            --project ${{ needs.changes.outputs.gcp_project_id }} >/dev/null 2>&1; then
            gcloud run jobs update carditrack-dev-pipeline-jobs-themer \
              --image ${{ needs.push-pipeline-image.outputs.image }} \
              --region ${{ needs.changes.outputs.gcp_region }} \
              --project ${{ needs.changes.outputs.gcp_project_id }} \
              --quiet
          else
            echo "themer job not created yet (Terraform apply pending) — skipping its image update"
          fi

  patch-tag:
    name: Create Patch Tag
    needs:
      - changes
      - compute-version
      - deploy-api-dev
      - deploy-web-dev
      - deploy-worker-dev
    permissions:
      contents: write
    # compute-version must have *succeeded*, not merely not-failed. It is gated on api/web/worker/
    # pipeline/webhook having changed, so an infrastructure- or docs-only merge to main skips it — and
    # `contains(needs.*.result, 'success')` was still satisfied by `changes` alone, so this job ran
    # anyway with an empty version and asked the API to create `refs/tags/`, which is a 422. The
    # 2026-08-13 #239 merge was the first infra-only merge to reach main and failed exactly there.
    #
    # Nothing was mis-deployed when that happened: every build and deploy job had skipped for the
    # same reason compute-version did, so the tag was the only casualty. But it fails the whole
    # run, so an infra merge looks broken.
    if: |
      always() &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.compute-version.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # Tag via the REST API, not `git push`: receive-pack rejects any ref
      # update whose commit touches .github/workflows/* unless the credential
      # has the `workflows` scope — which GITHUB_TOKEN can never be granted.
      # The create-ref endpoint skips that check because it uploads nothing:
      # it just names a commit that already exists on main. No checkout needed.
      - name: Create tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/${TAG}" \
            -f sha="${{ github.sha }}"
          echo "### Tagged: \`$TAG\`" >> $GITHUB_STEP_SUMMARY

  # ── Did the manual run actually do anything? ────────────────────────────────
  #
  # A dispatch whose job graph collapses is indistinguishable from a successful one: everything
  # skips, and GitHub scores a run of nothing as a green tick. That is exactly how the broken
  # ACTIONS_ON_PUSH gate above went unnoticed — the run was ✓ and had built and deployed nothing.
  # This makes that state red.
  #
  # Dispatch-only on purpose. On push and pull_request a fully-skipped run is the *intended*
  # outcome whenever the flag is off, so asserting there would fail on the normal case.
  dispatch-sanity:
    name: Dispatch ran something
    needs: [changes]
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Assert the dispatch resolved its components
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SELECTED: >-
            ${{ needs.changes.outputs.api }} ${{ needs.changes.outputs.web }}
            ${{ needs.changes.outputs.worker }}
            ${{ needs.changes.outputs.pipeline }}
            ${{ needs.changes.outputs.webhook }}
        run: |
          set -euo pipefail
          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo "::error::Manual dispatch resolved no components — 'Detect changes' was ${CHANGES_RESULT}, so every build and deploy job skipped. Nothing was built or deployed."
            exit 1
          fi
          # Unticking every box is a legitimate no-op, but it is almost never intended; say so
          # without failing, since the graph itself is healthy.
          case "${SELECTED}" in
            *true*) echo "Components selected: ${SELECTED}" ;;
            *) echo "::warning::Dispatch ran with every component unticked — nothing to build or deploy." ;;
          esac
