          gcloud run jobs execute $JOB \
            --wait \
            --region $REGION \
            --project $PROJECT

  deploy-api-dev:
    name: Deploy API → Dev
    needs: [changes, push-api-image, run-db-migrations]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      # The app refuses to start without a valid key, so an unseeded secret would fail
      # the revision with an opaque container-startup error. Fail here with a usable one.
      - name: Verify encryption key is seeded
        env:
          SECRET_ID: carditrack-dev-encryption-key
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          VALUE=$(gcloud secrets versions access latest --secret="$SECRET_ID" --project="$PROJECT" 2>/dev/null || true)
          # Strip whitespace and compare case-insensitively, matching the app's own
          # placeholder handling. Any placeholder would fail the length check below
          # regardless — normalising just gets the actionable message instead.
          TRIMMED=$(printf '%s' "$VALUE" | tr -d '[:space:]')
          if [ -z "$TRIMMED" ] || [ "$(printf '%s' "$TRIMMED" | tr '[:lower:]' '[:upper:]')" = "REPLACE_ME" ]; then
            echo "::error::$SECRET_ID is not seeded. Set it to a base64-encoded 256-bit key: openssl rand -base64 32 | gcloud secrets versions add $SECRET_ID --project=$PROJECT --data-file=-"
            exit 1
          fi
          LEN=$(printf '%s' "$TRIMMED" | base64 -d 2>/dev/null | wc -c | tr -d '[:space:]' || true)
          if [ "$LEN" != "32" ]; then
            echo "::error::$SECRET_ID must be a base64-encoded 256-bit key (32 bytes decoded); it decodes to $LEN bytes."
            exit 1
          fi
      - name: Deploy
        run: |
          gcloud run deploy carditrack-dev-api \
            --image ${{ needs.push-api-image.outputs.image }} \
            --region ${{ needs.changes.outputs.gcp_region }} \
            --project ${{ needs.changes.outputs.gcp_project_id }} \
            --add-cloudsql-instances carditrack-490120:europe-west2:carditrack-dev-sql \
            --quiet
      - name: Smoke test
        env:
          SECRET_ID: carditrack-dev-health-token
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          HEALTH_TOKEN=$(gcloud secrets versions access latest \
            --secret="$SECRET_ID" \
            --project="$PROJECT")
          # Cloud Run marks a revision Ready as soon as its first instance passes the
          # startup probe, then scales out the rest of min-instances concurrently. A
          # request landing on one of those still-cold instances right after rollout
          # fails with a platform-level 500 ("the instance could not start
          # successfully") even though the app itself never errored. Retry through
          # that window instead of failing the deploy on a single unlucky request.
          for attempt in 1 2 3 4 5; do
            # `|| echo "000"` keeps a connect/DNS/TLS failure from tripping this
            # step's `set -e` and aborting before the loop gets to retry — curl's
            # own non-zero exit would otherwise propagate straight through the
            # `STATUS=$(...)` assignment.
            # `|| STATUS=000` outside the substitution, not `|| echo 000` inside it: curl still
            # writes its -w output on failure, so the inner form concatenates both into "000000".
            # Harmless here — the 200 test fails either way — but it makes the logged status a
            # lie, which is the sort of thing that costs an hour during an incident.
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
              -H "X-Health-Token: $HEALTH_TOKEN" \
              -A "carditrack-healthcheck" \
              "${{ needs.changes.outputs.api_url_dev }}/health") || STATUS="000"
            [ "$STATUS" = "200" ] && break
            echo "Health check attempt $attempt: HTTP $STATUS"
            [ "$attempt" = "5" ] || sleep 5
          done
          [ "$STATUS" = "200" ] || (echo "::error::Health check failed: HTTP $STATUS" && exit 1)

  deploy-web-dev:
    name: Deploy Web → Dev
    # Waits on run-db-migrations like every service that opens the database (Web wires the
    # DbContext too): schema-dependent code must never boot ahead of its schema. The #209
    # deploy proved the race is real — the Worker's startup pass hit a table 18 seconds
    # before the migrator created it. Migrations may legitimately be SKIPPED here (a change
    # that touches no src/Infrastructure path cannot contain a migration, but flips e.g.
    # web without api) — hence success-or-skipped rather than plain job ordering.
    # !cancelled() is what makes GitHub evaluate this condition at all when a needed job
    # was skipped; it also removes the implicit success() on the other needs, so the image
    # push is re-checked explicitly.
    needs: [changes, push-web-image, run-db-migrations]
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.web == 'true'
      && needs.push-web-image.result == 'success'
      && (needs.run-db-migrations.result == 'success' || needs.run-db-migrations.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: |
          gcloud run deploy carditrack-dev-web \
            --image ${{ needs.push-web-image.outputs.image }} \
            --region ${{ needs.changes.outputs.gcp_region }} \
            --project ${{ needs.changes.outputs.gcp_project_id }} \
            --quiet
      # Deliberately against the public domain, not the *.run.app URL. Web's ingress is
      # INGRESS_TRAFFIC_INTERNAL_LOAD_BALANCER whenever web_custom_domain is set, so the domain is
      # the only way in — and it is the whole path that broke: app.dev's DNS record was lost, its
      # managed certificate stopped renewing, and it expired on 2026-08-07. Nobody noticed for six
      # days, because this step did not exist and the deploy ended at `gcloud run deploy`, which
      # reports success as long as the revision starts.
      #
      # So this checks DNS, the certificate, Cloud Armor, the load balancer and the container in
      # one request. curl fails the step on a TLS error too (exit 35 was the symptom for those six
      # days), which a status-code-only check would have missed entirely.
      #
      # The user agent matters: Cloud Armor rejects curl's default with a 403. carditrack-healthcheck
      # is the same agent the API smoke test uses.
      - name: Smoke test
        env:
          WEB_URL: ${{ needs.changes.outputs.web_url_dev }}
        run: |
          # A smoke test with no target passes vacuously or fails confusingly, and either way
          # tests nothing. This is not hypothetical: the first version of this step shipped with
          # the changes job not forwarding web_url_dev, so WEB_URL was empty and every attempt
          # failed against "/" with no host.
          if [ -z "$WEB_URL" ]; then
            echo "::error::WEB_URL is empty — the changes job is not forwarding web_url_dev. Nothing was tested."
            exit 1
          fi

          # Cloud Run marks a revision Ready as soon as its first instance passes the startup
          # probe, then scales out the rest concurrently; a request landing on a still-cold
          # instance can 500 even though the app never errored. Retry through that window rather
          # than failing a good deploy on one unlucky request — same reasoning as the API's.
          for attempt in 1 2 3 4 5; do
            # The `|| STATUS=000` sits outside the substitution deliberately. Inside it, curl
            # still writes its -w output on failure, so `$(curl ... || echo 000)` concatenates
            # both and yields "000000" — which then matches neither the success test nor the
            # unreachable test below, and the useful diagnostic never prints.
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              -A "carditrack-healthcheck" \
              "$WEB_URL/") || STATUS="000"
            [ "$STATUS" = "200" ] && break
            echo "Web check attempt $attempt: HTTP $STATUS"
            [ "$attempt" = "5" ] || sleep 5
          done

          # 000 means curl never got a status: DNS failure, TLS failure or timeout. That is the
          # case worth naming explicitly, because it is the one that went unseen for six days.
          if [ "$STATUS" = "000" ]; then
            echo "::error::Web unreachable at $WEB_URL — no HTTP response. Check DNS resolves to the load balancer IP, and that the managed certificate is ACTIVE (gcloud compute ssl-certificates list --global)."
            exit 1
          fi
          [ "$STATUS" = "200" ] || (echo "::error::Web check failed: HTTP $STATUS" && exit 1)

  deploy-worker-dev:
    name: Deploy Worker → Dev
    # Same schema-before-code gate as deploy-web-dev — see the comment there. The Worker
    # is the service that actually lost this race on the #209 deploy (42P01 from
