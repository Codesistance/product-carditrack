name: CI / Deploy Apps → Dev

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      api:
        description: 'API'
        type: boolean
        default: true
      web:
        description: 'Web'
        type: boolean
        default: true
      worker:
        description: 'Worker'
        type: boolean
        default: true
      mobile:
        description: 'Mobile'
        type: boolean
        default: true
      medgemma:
        description: 'MedGemma'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Shared config (single source of truth via _env.yml) ─────────────────────
  env:
    uses: ./.github/workflows/_env.yml

  # ── Detect changed paths ─────────────────────────────────────────────────────
  # Also passes env outputs through so all downstream jobs get them
  # via needs.changes.outputs.* without needing an explicit env dependency.
  changes:
    name: Detect changes
    needs: env
    runs-on: ubuntu-latest
    outputs:
      api:            ${{ steps.manual.outputs.api      || steps.filter.outputs.api }}
      web:            ${{ steps.manual.outputs.web      || steps.filter.outputs.web }}
      worker:         ${{ steps.manual.outputs.worker   || steps.filter.outputs.worker }}
      mobile:         ${{ steps.manual.outputs.mobile   || steps.filter.outputs.mobile }}
      medgemma:       ${{ steps.manual.outputs.medgemma || steps.filter.outputs.medgemma }}
      dotnet_version:      ${{ needs.env.outputs.dotnet_version }}
      registry:            ${{ needs.env.outputs.registry }}
      gcp_project_id:      ${{ needs.env.outputs.gcp_project_id }}
      gcp_region:          ${{ needs.env.outputs.gcp_region }}
      gcp_wif_provider:    ${{ needs.env.outputs.gcp_wif_provider }}
      gcp_service_account: ${{ needs.env.outputs.gcp_service_account }}
      gcs_builds_bucket:   ${{ needs.env.outputs.gcs_builds_bucket }}
      api_url_dev:         ${{ needs.env.outputs.api_url_dev }}
    steps:
      - uses: actions/checkout@v6
      - name: Set components for manual run
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: |
          echo "api=${{ inputs.api }}"           >> $GITHUB_OUTPUT
          echo "web=${{ inputs.web }}"           >> $GITHUB_OUTPUT
          echo "worker=${{ inputs.worker }}"     >> $GITHUB_OUTPUT
          echo "mobile=${{ inputs.mobile }}"     >> $GITHUB_OUTPUT
          echo "medgemma=${{ inputs.medgemma }}" >> $GITHUB_OUTPUT
      - uses: dorny/paths-filter@v4
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            api:
              - '.github/workflows/deploy-apps-dev.yml'
              - '.github/workflows/deploy-apps-prod.yml'
              - 'src/Presentation/CardiTrack.API/**'
              - 'src/Core/**'
              - 'src/Infrastructure/**'
              - 'tests/**'
              - 'CardiTrack.sln'
            web:
              - '.github/workflows/deploy-apps-dev.yml'
              - '.github/workflows/deploy-apps-prod.yml'
              - 'src/Presentation/CardiTrack.Web/**'
              - 'src/Core/**'
              - 'src/Infrastructure/**'
              - 'CardiTrack.sln'
            worker:
              - '.github/workflows/deploy-apps-dev.yml'
              - '.github/workflows/deploy-apps-prod.yml'
              - 'src/Worker/**'
              - 'src/Core/**'
              - 'src/Infrastructure/**'
              - 'tests/**'
              - 'CardiTrack.sln'
            mobile:
              - '.github/workflows/deploy-apps-dev.yml'
              - '.github/workflows/deploy-apps-prod.yml'
              - 'src/Presentation/CardiTrack.Mobile/**'
              - 'src/Core/CardiTrack.Domain/**'
              - 'src/Core/CardiTrack.Application/**'
              - 'CardiTrack.sln'
            medgemma:
              - 'src/Infrastructure/MedGemma/**'

  # ── Compute next semver (main only) ─────────────────────────────────────────
  compute-version:
    name: Compute next version
    needs: changes
    if: |
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.api    == 'true' ||
       needs.changes.outputs.web    == 'true' ||
       needs.changes.outputs.worker == 'true' ||
       needs.changes.outputs.mobile == 'true')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compute patch bump
        id: version
        run: |
          git fetch --tags
          LATEST=$(git tag --sort=-version:refname | grep '^v[0-9]' | head -1)
          if [ -z "$LATEST" ]; then LATEST="v0.0.0"; fi
          MAJOR=$(echo ${LATEST#v} | cut -d. -f1)
          MINOR=$(echo ${LATEST#v} | cut -d. -f2)
          PATCH=$(echo ${LATEST#v} | cut -d. -f3)
          NEXT="v${MAJOR}.${MINOR}.$((PATCH+1))"
          echo "version=${NEXT}" >> $GITHUB_OUTPUT
          echo "Next version: ${NEXT}"
          # Monotonic build number for store uploads (TestFlight CFBundleVersion / Play versionCode)
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Build number: ${BUILD_NUMBER}"

  # ── API ─────────────────────────────────────────────────────────────────────
  build-api:
    name: Build API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - run: dotnet restore src/Presentation/CardiTrack.API/CardiTrack.API.csproj
      - run: dotnet build src/Presentation/CardiTrack.API/CardiTrack.API.csproj -c Release --no-restore

  # Tests and the migration check compile what they need themselves, so they gate
  # on `changes` rather than `build-api` — chaining only delayed them behind a
  # duplicate build. push-api-image still requires all of them to succeed.
  test-unit:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - run: dotnet restore tests/CardiTrack.UnitTests/CardiTrack.UnitTests.csproj
      - run: |
          dotnet test tests/CardiTrack.UnitTests/CardiTrack.UnitTests.csproj \
            -c Release \
            --logger trx \
            --collect:"XPlat Code Coverage"
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results
          path: '**/*.trx'
          retention-days: 7

  test-integration:
    name: Integration Tests
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - run: dotnet restore tests/CardiTrack.IntegrationTests/CardiTrack.IntegrationTests.csproj
      - run: |
          dotnet test tests/CardiTrack.IntegrationTests/CardiTrack.IntegrationTests.csproj \
            -c Release \
            --logger trx
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results
          path: '**/*.trx'
          retention-days: 7

  check-migrations:
    name: EF Migration Check
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - run: dotnet tool install --global dotnet-ef
      - run: dotnet restore src/Presentation/CardiTrack.API/CardiTrack.API.csproj
      - run: dotnet build src/Presentation/CardiTrack.API/CardiTrack.API.csproj -c Release --no-restore
      - name: Check for pending model changes
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/Infrastructure/CardiTrack.Infrastructure/CardiTrack.Infrastructure.csproj \
            --startup-project src/Presentation/CardiTrack.API/CardiTrack.API.csproj \
            --configuration Release \
            --no-build
        env:
          SKIP_DB_CONTEXT_VALIDATION: 'true'

  security-api:
    name: Security Scan (API)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - name: Dependency vulnerability audit
        run: |
          dotnet restore src/Presentation/CardiTrack.API/CardiTrack.API.csproj
          dotnet list src/Presentation/CardiTrack.API/CardiTrack.API.csproj package \
            --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -E "^\s+> " audit.txt | grep -qv "GHSA-rvv3-g6hj-g44x"; then
            echo "::error::Vulnerable packages detected — review audit.txt"
            exit 1
          fi

  # ── Web ─────────────────────────────────────────────────────────────────────
  build-web:
    name: Build Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - run: dotnet restore src/Presentation/CardiTrack.Web/CardiTrack.Web.csproj
      - run: dotnet build src/Presentation/CardiTrack.Web/CardiTrack.Web.csproj -c Release --no-restore

  security-web:
    name: Security Scan (Web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - name: Dependency vulnerability audit
        run: |
          dotnet restore src/Presentation/CardiTrack.Web/CardiTrack.Web.csproj
          dotnet list src/Presentation/CardiTrack.Web/CardiTrack.Web.csproj package \
            --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -E "^\s+> " audit.txt | grep -qv "GHSA-rvv3-g6hj-g44x"; then
            echo "::error::Vulnerable packages detected — review audit.txt"
            exit 1
          fi

  # ── Worker ───────────────────────────────────────────────────────────────────
  build-worker:
    name: Build Worker
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - run: dotnet restore src/Worker/CardiTrack.Worker/CardiTrack.Worker.csproj
      - run: dotnet build src/Worker/CardiTrack.Worker/CardiTrack.Worker.csproj -c Release --no-restore

  test-unit-worker:
    name: Unit Tests (Worker)
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - run: dotnet restore tests/CardiTrack.UnitTests/CardiTrack.UnitTests.csproj
      - run: |
          dotnet test tests/CardiTrack.UnitTests/CardiTrack.UnitTests.csproj \
            -c Release \
            --logger trx \
            --filter "Category=Worker"
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: worker-test-results
          path: '**/*.trx'
          retention-days: 7

  security-worker:
    name: Security Scan (Worker)
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - name: Dependency vulnerability audit
        run: |
          dotnet restore src/Worker/CardiTrack.Worker/CardiTrack.Worker.csproj
          dotnet list src/Worker/CardiTrack.Worker/CardiTrack.Worker.csproj package \
            --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -E "^\s+> " audit.txt | grep -qv "GHSA-rvv3-g6hj-g44x"; then
            echo "::error::Vulnerable packages detected — review audit.txt"
            exit 1
          fi

  # ── Mobile ───────────────────────────────────────────────────────────────────
  build-mobile-android:
    name: Build Mobile (Android)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - run: dotnet workload install maui-android
      # Auth0 config is stamped from Secret Manager (carditrack-dev-auth0-*).
      # PR builds skip the fetch (no WIF auth off main) and compile unstamped.
      - uses: google-github-actions/auth@v3
        if: github.event_name != 'pull_request'
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/get-secretmanager-secrets@v2
        if: github.event_name != 'pull_request'
        id: auth0
        with:
          secrets: |
            domain:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-auth0-domain
            audience:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-auth0-audience
            mobile_client_id:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-auth0-mobile-client-id
            apm_mobile_engine:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-apm-mobile-engine
            apm_mobile_data:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-apm-mobile-data
      # A PR only needs to know the code and XAML compile. Release adds the ILLink
      # trimmer, AOT and R8 after compilation has already succeeded — measured at
      # ~3.4 min of the 4.3 min step — to produce an APK nothing downloads. Debug
      # skips all of it; main still builds Release below.
      - name: Compile (PR)
        if: github.event_name == 'pull_request'
        run: |
          dotnet build src/Presentation/CardiTrack.Mobile/CardiTrack.Mobile.csproj \
            -f net10.0-android \
            -c Debug
      - name: Publish (Release)
        if: github.event_name != 'pull_request'
        env:
          APM_DATA: ${{ steps.auth0.outputs.apm_mobile_data }}
        run: |
          # Placeholder data => stamp empty => monitoring off; base64 survives the shell/MSBuild boundary
          if [ "$APM_DATA" = "REPLACE_ME" ]; then APM_DATA=""; fi
          dotnet publish src/Presentation/CardiTrack.Mobile/CardiTrack.Mobile.csproj \
            -f net10.0-android \
            -c Release \
            -p:ApiBaseUrl=${{ needs.changes.outputs.api_url_dev }} \
            -p:Auth0Domain=${{ steps.auth0.outputs.domain }} \
            -p:Auth0ClientId=${{ steps.auth0.outputs.mobile_client_id }} \
            -p:Auth0Audience=${{ steps.auth0.outputs.audience }} \
            -p:ApmEngine=${{ steps.auth0.outputs.apm_mobile_engine }} \
            -p:ApmData=$(printf '%s' "$APM_DATA" | base64 | tr -d '\n')
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: mobile-android
          path: '**/*.apk'
          retention-days: 7

  build-mobile-ios:
    name: Build Mobile (iOS)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> $GITHUB_ENV
      - run: dotnet workload install maui-ios --version 10.0.300.1
      # Auth0 config is stamped from Secret Manager (carditrack-dev-auth0-*).
      # PR builds skip the fetch (no WIF auth off main) and compile unstamped.
      - uses: google-github-actions/auth@v3
        if: github.event_name != 'pull_request'
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/get-secretmanager-secrets@v2
        if: github.event_name != 'pull_request'
        id: auth0
        with:
          secrets: |
            domain:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-auth0-domain
            audience:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-auth0-audience
            mobile_client_id:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-auth0-mobile-client-id
            apm_mobile_engine:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-apm-mobile-engine
            apm_mobile_data:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-apm-mobile-data
      # Same trade as Android, and the reason PR CI took ~10 min: of a 10.5 min
      # Release step, the managed compile finished in 70 s and the remaining
      # ~9 min was the ILLink trimmer and AOT. Debug skips both. Release device
      # builds (build-mobile-ios-device) still run on main before any upload.
      - name: Compile (PR)
        if: github.event_name == 'pull_request'
        run: |
          dotnet build src/Presentation/CardiTrack.Mobile/CardiTrack.Mobile.csproj \
            -f net10.0-ios \
            -c Debug \
            -r iossimulator-arm64 \
            -p:ArchiveOnBuild=false
      - name: Build (Release)
        if: github.event_name != 'pull_request'
        env:
          APM_DATA: ${{ steps.auth0.outputs.apm_mobile_data }}
        run: |
          if [ "$APM_DATA" = "REPLACE_ME" ]; then APM_DATA=""; fi
          dotnet build src/Presentation/CardiTrack.Mobile/CardiTrack.Mobile.csproj \
            -f net10.0-ios \
            -c Release \
            -r iossimulator-arm64 \
            -p:ArchiveOnBuild=false \
            -p:ApiBaseUrl=${{ needs.changes.outputs.api_url_dev }} \
            -p:Auth0Domain=${{ steps.auth0.outputs.domain }} \
            -p:Auth0ClientId=${{ steps.auth0.outputs.mobile_client_id }} \
            -p:Auth0Audience=${{ steps.auth0.outputs.audience }} \
            -p:ApmEngine=${{ steps.auth0.outputs.apm_mobile_engine }} \
            -p:ApmData=$(printf '%s' "$APM_DATA" | base64 | tr -d '\n')

  # Main only. Nothing ships from the Windows target — there is no store upload
  # and deploy-apps-prod.yml never references it; the msix just lands in the GCS
  # builds bucket. Its exclusive compile surface is one #if WINDOWS block in
  # SecureTokenStore.cs (a fallback its own comment marks dev-only) plus the
  # Platforms/Windows boilerplate, so running it per-PR bought little and, once
  # the iOS and Android builds were cut to Debug, it *was* the PR critical path
  # at ~5 min. A break here is caught on the next merge and blocks no release.
  build-mobile-windows:
    name: Build Mobile (Windows)
    needs: changes
    if: needs.changes.outputs.mobile == 'true' && github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      # Do not try to cache the workload packs here. It was measured in #42 and
      # it loses: DOTNET_ROOT\packs holds every workload preinstalled on the
      # runner image, so saving it cost 11 min against a 2.9 min install, and a
      # warm restore has to pull that same multi-GB archive back down. The
      # install is cheap enough that no cache round-trip beats it.
      - run: dotnet workload install maui-windows
      - run: dotnet restore src/Presentation/CardiTrack.Mobile/CardiTrack.Mobile.csproj -p:TargetFrameworks=net10.0-windows10.0.19041.0 -r win-x64
      - run: dotnet restore src/Core/CardiTrack.Application/CardiTrack.Application.csproj
      - run: dotnet restore src/Core/CardiTrack.Domain/CardiTrack.Domain.csproj
      - run: dotnet restore src/Presentation/CardiTrack.Mobile.Core/CardiTrack.Mobile.Core.csproj
      # Auth0 config is stamped from Secret Manager (carditrack-dev-auth0-*).
      # No PR guard needed on these — the job itself is main-only.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/get-secretmanager-secrets@v2
        id: auth0
        with:
          secrets: |
            domain:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-auth0-domain
            audience:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-auth0-audience
            mobile_client_id:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-auth0-mobile-client-id
      - run: |
          dotnet publish src/Presentation/CardiTrack.Mobile/CardiTrack.Mobile.csproj `
            -f net10.0-windows10.0.19041.0 `
            -c Release `
            --no-restore `
            -r win-x64 `
            -p:TargetFrameworks=net10.0-windows10.0.19041.0 `
            -p:PublishReadyToRun=false `
            -p:ApiBaseUrl=${{ needs.changes.outputs.api_url_dev }} `
            -p:Auth0Domain=${{ steps.auth0.outputs.domain }} `
            -p:Auth0ClientId=${{ steps.auth0.outputs.mobile_client_id }} `
            -p:Auth0Audience=${{ steps.auth0.outputs.audience }}
      # Consumed by upload-mobile-artifacts → GCS.
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-windows
          path: '**/*.msix'
          retention-days: 7

  security-mobile:
    name: Security Scan (Mobile)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - name: Dependency vulnerability audit
        run: |
          dotnet workload install maui-android
          dotnet restore src/Presentation/CardiTrack.Mobile/CardiTrack.Mobile.csproj -p:TargetFrameworks=net10.0-android
          dotnet list src/Presentation/CardiTrack.Mobile/CardiTrack.Mobile.csproj package \
            --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -E "^\s+> " audit.txt | grep -qv "GHSA-rvv3-g6hj-g44x"; then
            echo "::error::Vulnerable packages detected — review audit.txt"
            exit 1
          fi

  # ── Main only: Store-grade signed builds ────────────────────────────────────
  # Signed device builds for TestFlight / Play Console. Each job gates on its
  # signing secrets being populated (not the REPLACE_ME placeholder) and skips
  # with a warning until the operator completes the one-time store setup.
  build-mobile-android-signed:
    name: Build Mobile (Android, signed)
    needs:
      - changes
      - compute-version
      - security-mobile
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.gate.outputs.available }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Check signing secrets
        id: gate
        env:
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          MISSING=""
          for SECRET in carditrack-common-android-keystore carditrack-common-android-keystore-password; do
            VALUE=$(gcloud secrets versions access latest --secret="$SECRET" --project="$PROJECT" 2>/dev/null || true)
            if [ -z "$VALUE" ] || [ "$VALUE" = "REPLACE_ME" ]; then MISSING="$MISSING $SECRET"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::Skipping signed Android build — secrets not populated:$MISSING"
            echo "### Signed Android build skipped" >> $GITHUB_STEP_SUMMARY
            echo "Populate$MISSING in Secret Manager to enable Play Console uploads." >> $GITHUB_STEP_SUMMARY
            echo "available=false" >> $GITHUB_OUTPUT
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - uses: google-github-actions/get-secretmanager-secrets@v2
        if: steps.gate.outputs.available == 'true'
        id: secrets
        with:
          secrets: |
            keystore:${{ needs.changes.outputs.gcp_project_id }}/carditrack-common-android-keystore
            keystore_password:${{ needs.changes.outputs.gcp_project_id }}/carditrack-common-android-keystore-password
            auth0_domain:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-auth0-domain
            auth0_audience:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-auth0-audience
            auth0_mobile_client_id:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-auth0-mobile-client-id
            apm_mobile_engine:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-apm-mobile-engine
            apm_mobile_data:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-apm-mobile-data

      - name: Decode keystore
        if: steps.gate.outputs.available == 'true'
        env:
          KEYSTORE_B64: ${{ steps.secrets.outputs.keystore }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/carditrack.keystore"

      - name: Install MAUI workload
        if: steps.gate.outputs.available == 'true'
        run: dotnet workload install maui-android

      - name: Publish signed AAB + APK
        if: steps.gate.outputs.available == 'true'
        env:
          DISPLAY_VERSION: ${{ needs.compute-version.outputs.version }}
          BUILD_NUMBER: ${{ needs.compute-version.outputs.build_number }}
          KEYSTORE_PASSWORD: ${{ steps.secrets.outputs.keystore_password }}
          APM_DATA: ${{ steps.secrets.outputs.apm_mobile_data }}
        run: |
          if [ "$APM_DATA" = "REPLACE_ME" ]; then APM_DATA=""; fi
          # AndroidPackageFormats defaults to aab;apk — don't pass it via -p:
          # (MSBuild splits on the semicolon and misparses "apk" as a switch)
          dotnet publish src/Presentation/CardiTrack.Mobile/CardiTrack.Mobile.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/carditrack.keystore" \
            -p:AndroidSigningKeyAlias=carditrack \
            -p:AndroidSigningStorePass="$KEYSTORE_PASSWORD" \
            -p:AndroidSigningKeyPass="$KEYSTORE_PASSWORD" \
            -p:ApplicationDisplayVersion="${DISPLAY_VERSION#v}" \
            -p:ApplicationVersion="$BUILD_NUMBER" \
            -p:ApiBaseUrl=${{ needs.changes.outputs.api_url_dev }} \
            -p:Auth0Domain=${{ steps.secrets.outputs.auth0_domain }} \
            -p:Auth0ClientId=${{ steps.secrets.outputs.auth0_mobile_client_id }} \
            -p:Auth0Audience=${{ steps.secrets.outputs.auth0_audience }} \
            -p:ApmEngine=${{ steps.secrets.outputs.apm_mobile_engine }} \
            -p:ApmData=$(printf '%s' "$APM_DATA" | base64 | tr -d '\n')

      # Play Console crash-report inputs: the R8 deobfuscation map produced by
      # AndroidLinkTool=r8 (see CardiTrack.Mobile.csproj) and a zip of the
      # pre-strip native libraries for symbolicated native stack traces.
      - name: Stage Play crash-report files
        if: steps.gate.outputs.available == 'true'
        run: |
          OUT_DIR=src/Presentation/CardiTrack.Mobile/bin/Release/net10.0-android
          OBJ_DIR=src/Presentation/CardiTrack.Mobile/obj/Release/net10.0-android
          mkdir -p play-extras
          cp "$OUT_DIR/mapping.txt" play-extras/mapping.txt
          (cd "$OBJ_DIR/app_shared_libraries" && zip -r "$GITHUB_WORKSPACE/play-extras/native-debug-symbols.zip" . -i '*.so')

      - uses: actions/upload-artifact@v7
        if: steps.gate.outputs.available == 'true'
        with:
          name: mobile-android-signed
          path: |
            **/publish/*-Signed.*
            play-extras/*
          retention-days: 7

  build-mobile-ios-device:
    name: Build Mobile (iOS, device)
    needs:
      - changes
      - compute-version
      - security-mobile
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.mobile == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    outputs:
      available: ${{ steps.gate.outputs.available }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.changes.outputs.dotnet_version }}
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Check signing secrets
        id: gate
        env:
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          MISSING=""
          for SECRET in carditrack-common-apple-distribution-cert-p12 carditrack-common-apple-cert-password carditrack-common-appstore-provisioning-profile; do
            VALUE=$(gcloud secrets versions access latest --secret="$SECRET" --project="$PROJECT" 2>/dev/null || true)
            if [ -z "$VALUE" ] || [ "$VALUE" = "REPLACE_ME" ]; then MISSING="$MISSING $SECRET"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::Skipping signed iOS build — secrets not populated:$MISSING"
            echo "### Signed iOS build skipped" >> $GITHUB_STEP_SUMMARY
            echo "Populate$MISSING in Secret Manager to enable TestFlight uploads." >> $GITHUB_STEP_SUMMARY
            echo "available=false" >> $GITHUB_OUTPUT
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - uses: google-github-actions/get-secretmanager-secrets@v2
        if: steps.gate.outputs.available == 'true'
        id: secrets
        with:
          secrets: |
            cert_p12:${{ needs.changes.outputs.gcp_project_id }}/carditrack-common-apple-distribution-cert-p12
            cert_password:${{ needs.changes.outputs.gcp_project_id }}/carditrack-common-apple-cert-password
            provisioning_profile:${{ needs.changes.outputs.gcp_project_id }}/carditrack-common-appstore-provisioning-profile
            auth0_domain:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-auth0-domain
            auth0_audience:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-auth0-audience
            auth0_mobile_client_id:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-auth0-mobile-client-id
            apm_mobile_engine:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-apm-mobile-engine
            apm_mobile_data:${{ needs.changes.outputs.gcp_project_id }}/carditrack-dev-apm-mobile-data

      - name: Install certificate and provisioning profile
        if: steps.gate.outputs.available == 'true'
        env:
          CERT_P12_B64: ${{ steps.secrets.outputs.cert_p12 }}
          CERT_PASSWORD: ${{ steps.secrets.outputs.cert_password }}
          PROFILE_B64: ${{ steps.secrets.outputs.provisioning_profile }}
        run: |
          echo "$CERT_P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "" build.keychain
          security unlock-keychain -p "" build.keychain
          # New keychains auto-lock after 300s; codesign runs minutes later and
          # would hang forever on the unlock prompt (headless runner).
          security set-keychain-settings -lut 21600 build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/carditrack-appstore.mobileprovision

      - name: Select Xcode
        if: steps.gate.outputs.available == 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.4.1.app
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> $GITHUB_ENV

      - name: Install MAUI workload
        if: steps.gate.outputs.available == 'true'
        run: dotnet workload install maui-ios --version 10.0.300.1

      - name: Publish signed IPA
        if: steps.gate.outputs.available == 'true'
        env:
          DISPLAY_VERSION: ${{ needs.compute-version.outputs.version }}
          BUILD_NUMBER: ${{ needs.compute-version.outputs.build_number }}
          APM_DATA: ${{ steps.secrets.outputs.apm_mobile_data }}
        run: |
          if [ "$APM_DATA" = "REPLACE_ME" ]; then APM_DATA=""; fi
          dotnet publish src/Presentation/CardiTrack.Mobile/CardiTrack.Mobile.csproj \
            -f net10.0-ios \
            -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:CodesignKey="Apple Distribution" \
            -p:CodesignProvision="CardiTrack Distribution" \
            -p:ApplicationDisplayVersion="${DISPLAY_VERSION#v}" \
            -p:ApplicationVersion="$BUILD_NUMBER" \
            -p:ApiBaseUrl=${{ needs.changes.outputs.api_url_dev }} \
            -p:Auth0Domain=${{ steps.secrets.outputs.auth0_domain }} \
            -p:Auth0ClientId=${{ steps.secrets.outputs.auth0_mobile_client_id }} \
            -p:Auth0Audience=${{ steps.secrets.outputs.auth0_audience }} \
            -p:ApmEngine=${{ steps.secrets.outputs.apm_mobile_engine }} \
            -p:ApmData=$(printf '%s' "$APM_DATA" | base64 | tr -d '\n')

      - uses: actions/upload-artifact@v7
        if: steps.gate.outputs.available == 'true'
        with:
          name: mobile-ios-ipa
          path: '**/*.ipa'
          retention-days: 7

  # ── Main only: Store uploads (internal testing) ─────────────────────────────
  deploy-testflight:
    name: Deploy → TestFlight
    needs:
      - changes
      - compute-version
      - build-mobile-ios-device
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.mobile == 'true' && needs.build-mobile-ios-device.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Check App Store Connect API secrets
        id: gate
        env:
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          MISSING=""
          for SECRET in carditrack-common-appstore-connect-issuer-id carditrack-common-appstore-connect-api-key-id carditrack-common-appstore-connect-api-private-key; do
            VALUE=$(gcloud secrets versions access latest --secret="$SECRET" --project="$PROJECT" 2>/dev/null || true)
            if [ -z "$VALUE" ] || [ "$VALUE" = "REPLACE_ME" ]; then MISSING="$MISSING $SECRET"; fi
          done
          if [ -n "$MISSING" ]; then
            echo "::warning::Skipping TestFlight upload — secrets not populated:$MISSING"
            echo "### TestFlight upload skipped" >> $GITHUB_STEP_SUMMARY
            echo "Populate$MISSING in Secret Manager to enable TestFlight uploads." >> $GITHUB_STEP_SUMMARY
            echo "available=false" >> $GITHUB_OUTPUT
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - uses: google-github-actions/get-secretmanager-secrets@v2
        if: steps.gate.outputs.available == 'true'
        id: secrets
        with:
          secrets: |
            issuer_id:${{ needs.changes.outputs.gcp_project_id }}/carditrack-common-appstore-connect-issuer-id
            api_key_id:${{ needs.changes.outputs.gcp_project_id }}/carditrack-common-appstore-connect-api-key-id
            api_private_key:${{ needs.changes.outputs.gcp_project_id }}/carditrack-common-appstore-connect-api-private-key

      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.available == 'true'
        with:
          name: mobile-ios-ipa
          path: artifacts/ios

      - name: Find IPA
        id: ipa
        if: steps.gate.outputs.available == 'true'
        run: echo "path=$(find artifacts/ios -name '*.ipa' | head -1)" >> $GITHUB_OUTPUT

      - name: Upload to TestFlight
        if: steps.gate.outputs.available == 'true'
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ steps.secrets.outputs.issuer_id }}
          api-key-id: ${{ steps.secrets.outputs.api_key_id }}
          api-private-key: ${{ steps.secrets.outputs.api_private_key }}

      - name: Summary
        if: steps.gate.outputs.available == 'true'
        run: |
          echo "### TestFlight — uploaded \`${{ needs.compute-version.outputs.version }}\` (build ${{ needs.compute-version.outputs.build_number }})" >> $GITHUB_STEP_SUMMARY

  deploy-play-internal:
    name: Deploy → Play Console (internal)
    needs:
      - changes
      - compute-version
      - build-mobile-android-signed
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.mobile == 'true' && needs.build-mobile-android-signed.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3

      - name: Check Play Console secrets
        id: gate
        env:
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          SECRET=carditrack-common-play-service-account-key
          VALUE=$(gcloud secrets versions access latest --secret="$SECRET" --project="$PROJECT" 2>/dev/null || true)
          if [ -z "$VALUE" ] || [ "$VALUE" = "REPLACE_ME" ]; then
            echo "::warning::Skipping Play Console upload — $SECRET not populated"
            echo "### Play Console upload skipped" >> $GITHUB_STEP_SUMMARY
            echo "Populate \`$SECRET\` in Secret Manager to enable Play Console uploads." >> $GITHUB_STEP_SUMMARY
            echo "available=false" >> $GITHUB_OUTPUT
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi

      - uses: google-github-actions/get-secretmanager-secrets@v2
        if: steps.gate.outputs.available == 'true'
        id: secrets
        with:
          secrets: |
            play_key:${{ needs.changes.outputs.gcp_project_id }}/carditrack-common-play-service-account-key

      - uses: actions/download-artifact@v8
        if: steps.gate.outputs.available == 'true'
        with:
          name: mobile-android-signed
          path: artifacts/android

      - name: Find AAB
        id: aab
        if: steps.gate.outputs.available == 'true'
        run: |
          echo "path=$(find artifacts/android -name '*-Signed.aab' | head -1)" >> $GITHUB_OUTPUT
          echo "mapping=$(find artifacts/android -name 'mapping.txt' | head -1)" >> $GITHUB_OUTPUT
          echo "symbols=$(find artifacts/android -name 'native-debug-symbols.zip' | head -1)" >> $GITHUB_OUTPUT

      - name: Upload to Play Console (internal track)
        if: steps.gate.outputs.available == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ steps.secrets.outputs.play_key }}
          packageName: com.codesistance.carditrack.mobile
          releaseFiles: ${{ steps.aab.outputs.path }}
          mappingFile: ${{ steps.aab.outputs.mapping }}
          debugSymbols: ${{ steps.aab.outputs.symbols }}
          tracks: internal
          status: completed

      - name: Summary
        if: steps.gate.outputs.available == 'true'
        run: |
          echo "### Play Console (internal) — uploaded \`${{ needs.compute-version.outputs.version }}\` (versionCode ${{ needs.compute-version.outputs.build_number }})" >> $GITHUB_STEP_SUMMARY

  # ── Main only: Push images ───────────────────────────────────────────────────
  push-api-image:
    name: Push API Image
    needs:
      - changes
      - compute-version
      - build-api
      - test-unit
      - test-integration
      - security-api
      - check-migrations
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ needs.changes.outputs.gcp_region }}-docker.pkg.dev --quiet
      - name: Build and push
        id: push
        env:
          IMAGE: ${{ needs.changes.outputs.registry }}/api
          TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          docker build -f src/Presentation/CardiTrack.API/Dockerfile \
            -t $IMAGE:$TAG \
            .
          docker push $IMAGE:$TAG
          echo "image=$IMAGE:$TAG" >> $GITHUB_OUTPUT

  push-migrator-image:
    name: Push Migrator Image
    needs:
      - changes
      - compute-version
      - build-api
      - test-unit
      - test-integration
      - security-api
      - check-migrations
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ needs.changes.outputs.gcp_region }}-docker.pkg.dev --quiet
      - name: Build and push
        id: push
        env:
          IMAGE: ${{ needs.changes.outputs.registry }}/migrator
          TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          docker build -f src/Presentation/CardiTrack.API/Dockerfile.migrate \
            -t $IMAGE:$TAG \
            .
          docker push $IMAGE:$TAG
          echo "image=$IMAGE:$TAG" >> $GITHUB_OUTPUT

  push-web-image:
    name: Push Web Image
    needs:
      - changes
      - compute-version
      - build-web
      - security-web
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ needs.changes.outputs.gcp_region }}-docker.pkg.dev --quiet
      - name: Build and push
        id: push
        env:
          IMAGE: ${{ needs.changes.outputs.registry }}/web
          TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          docker build -f src/Presentation/CardiTrack.Web/Dockerfile \
            -t $IMAGE:$TAG \
            .
          docker push $IMAGE:$TAG
          echo "image=$IMAGE:$TAG" >> $GITHUB_OUTPUT

  push-worker-image:
    name: Push Worker Image
    needs:
      - changes
      - compute-version
      - build-worker
      - test-unit-worker
      - security-worker
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ needs.changes.outputs.gcp_region }}-docker.pkg.dev --quiet
      - name: Build and push
        id: push
        env:
          IMAGE: ${{ needs.changes.outputs.registry }}/worker
          TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          docker build -f src/Worker/CardiTrack.Worker/Dockerfile \
            -t $IMAGE:$TAG \
            .
          docker push $IMAGE:$TAG
          echo "image=$IMAGE:$TAG" >> $GITHUB_OUTPUT

  upload-mobile-artifacts:
    name: Upload Mobile Artifacts to GCS
    needs:
      - changes
      - compute-version
      - build-mobile-android-signed
      - build-mobile-ios-device
      - build-mobile-windows
      - security-mobile
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: actions/download-artifact@v8
        if: needs.build-mobile-android-signed.outputs.available == 'true'
        with:
          name: mobile-android-signed
          path: artifacts/android
      - uses: actions/download-artifact@v8
        if: needs.build-mobile-ios-device.outputs.available == 'true'
        with:
          name: mobile-ios-ipa
          path: artifacts/ios
      - uses: actions/download-artifact@v8
        with:
          name: mobile-windows
          path: artifacts/windows
      - name: Upload to GCS
        env:
          TAG: ${{ needs.compute-version.outputs.version }}
          BUCKET: gs://${{ needs.changes.outputs.gcs_builds_bucket }}
        run: |
          # Android / iOS are absent until the store signing secrets are populated
          if [ -d artifacts/android ]; then gcloud storage cp -r artifacts/android/** $BUCKET/$TAG/android/; fi
          if [ -d artifacts/ios ];     then gcloud storage cp -r artifacts/ios/**     $BUCKET/$TAG/ios/; fi
          gcloud storage cp -r artifacts/windows/** $BUCKET/$TAG/windows/

  # ── Main only: DB Migrations + Deploy Dev ───────────────────────────────────
  run-db-migrations:
    name: DB Migrations (Dev)
    needs: [changes, push-migrator-image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Update migrator job image
        env:
          JOB: carditrack-dev-api-migrator
          IMAGE: ${{ needs.push-migrator-image.outputs.image }}
          REGION: ${{ needs.changes.outputs.gcp_region }}
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          gcloud run jobs update $JOB \
            --image $IMAGE \
            --region $REGION \
            --project $PROJECT \
            --quiet
      - name: Execute migrations
        env:
          JOB: carditrack-dev-api-migrator
          REGION: ${{ needs.changes.outputs.gcp_region }}
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          gcloud run jobs execute $JOB \
            --wait \
            --region $REGION \
            --project $PROJECT

  deploy-api-dev:
    name: Deploy API → Dev
    needs: [changes, push-api-image, run-db-migrations]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      # The app refuses to start without a valid key, so an unseeded secret would fail
      # the revision with an opaque container-startup error. Fail here with a usable one.
      - name: Verify encryption key is seeded
        env:
          SECRET_ID: carditrack-dev-encryption-key
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          VALUE=$(gcloud secrets versions access latest --secret="$SECRET_ID" --project="$PROJECT" 2>/dev/null || true)
          # Strip whitespace and compare case-insensitively, matching the app's own
          # placeholder handling. Any placeholder would fail the length check below
          # regardless — normalising just gets the actionable message instead.
          TRIMMED=$(printf '%s' "$VALUE" | tr -d '[:space:]')
          if [ -z "$TRIMMED" ] || [ "$(printf '%s' "$TRIMMED" | tr '[:lower:]' '[:upper:]')" = "REPLACE_ME" ]; then
            echo "::error::$SECRET_ID is not seeded. Set it to a base64-encoded 256-bit key: openssl rand -base64 32 | gcloud secrets versions add $SECRET_ID --project=$PROJECT --data-file=-"
            exit 1
          fi
          LEN=$(printf '%s' "$TRIMMED" | base64 -d 2>/dev/null | wc -c | tr -d '[:space:]' || true)
          if [ "$LEN" != "32" ]; then
            echo "::error::$SECRET_ID must be a base64-encoded 256-bit key (32 bytes decoded); it decodes to $LEN bytes."
            exit 1
          fi
      - name: Deploy
        run: |
          gcloud run deploy carditrack-dev-api \
            --image ${{ needs.push-api-image.outputs.image }} \
            --region ${{ needs.changes.outputs.gcp_region }} \
            --project ${{ needs.changes.outputs.gcp_project_id }} \
            --add-cloudsql-instances carditrack-490120:europe-west2:carditrack-dev-sql \
            --quiet
      - name: Smoke test
        env:
          SECRET_ID: carditrack-dev-health-token
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          HEALTH_TOKEN=$(gcloud secrets versions access latest \
            --secret="$SECRET_ID" \
            --project="$PROJECT")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "X-Health-Token: $HEALTH_TOKEN" \
            -A "carditrack-healthcheck" \
            "${{ needs.changes.outputs.api_url_dev }}/health")
          [ "$STATUS" = "200" ] || (echo "::error::Health check failed: HTTP $STATUS" && exit 1)

  deploy-web-dev:
    name: Deploy Web → Dev
    needs: [changes, push-web-image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: |
          gcloud run deploy carditrack-dev-web \
            --image ${{ needs.push-web-image.outputs.image }} \
            --region ${{ needs.changes.outputs.gcp_region }} \
            --project ${{ needs.changes.outputs.gcp_project_id }} \
            --quiet

  deploy-worker-dev:
    name: Deploy Worker → Dev
    needs: [changes, push-worker-image]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      # Same gate as the API — the Worker decrypts the same OAuth tokens on refresh.
      - name: Verify encryption key is seeded
        env:
          SECRET_ID: carditrack-dev-encryption-key
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          VALUE=$(gcloud secrets versions access latest --secret="$SECRET_ID" --project="$PROJECT" 2>/dev/null || true)
          # Strip whitespace and compare case-insensitively, matching the app's own
          # placeholder handling. Any placeholder would fail the length check below
          # regardless — normalising just gets the actionable message instead.
          TRIMMED=$(printf '%s' "$VALUE" | tr -d '[:space:]')
          if [ -z "$TRIMMED" ] || [ "$(printf '%s' "$TRIMMED" | tr '[:lower:]' '[:upper:]')" = "REPLACE_ME" ]; then
            echo "::error::$SECRET_ID is not seeded. Set it to a base64-encoded 256-bit key: openssl rand -base64 32 | gcloud secrets versions add $SECRET_ID --project=$PROJECT --data-file=-"
            exit 1
          fi
          LEN=$(printf '%s' "$TRIMMED" | base64 -d 2>/dev/null | wc -c | tr -d '[:space:]' || true)
          if [ "$LEN" != "32" ]; then
            echo "::error::$SECRET_ID must be a base64-encoded 256-bit key (32 bytes decoded); it decodes to $LEN bytes."
            exit 1
          fi
      - run: |
          gcloud run deploy carditrack-dev-worker \
            --image ${{ needs.push-worker-image.outputs.image }} \
            --region ${{ needs.changes.outputs.gcp_region }} \
            --project ${{ needs.changes.outputs.gcp_project_id }} \
            --add-cloudsql-instances carditrack-490120:europe-west2:carditrack-dev-sql \
            --quiet

  # ── MedGemma ─────────────────────────────────────────────────────────────────
  build-and-push-medgemma:
    name: Build & Push MedGemma Image
    needs: [changes, compute-version]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.medgemma == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ needs.changes.outputs.gcp_region }}-docker.pkg.dev --quiet
      - name: Read model version
        id: model
        run: echo "tag=$(cat src/Infrastructure/MedGemma/.model-version | tr -d '[:space:]')" >> $GITHUB_OUTPUT
      - name: Build and push
        env:
          IMAGE: ${{ needs.changes.outputs.registry }}/medgemma
          TAG: ${{ needs.compute-version.outputs.version }}
        run: |
          docker build \
            --build-arg MODEL_TAG=${{ steps.model.outputs.tag }} \
            -t $IMAGE:$TAG \
            -f src/Infrastructure/MedGemma/Dockerfile .
          docker push $IMAGE:$TAG
          docker tag $IMAGE:$TAG $IMAGE:stable
          docker push $IMAGE:stable
          echo "image=$IMAGE:$TAG" >> $GITHUB_OUTPUT
        id: push
      - name: Resolve image
        id: resolve
        env:
          IMAGE: ${{ needs.changes.outputs.registry }}/medgemma
        run: echo "image=$IMAGE:${{ needs.compute-version.outputs.version }}" >> $GITHUB_OUTPUT

  deploy-medgemma-dev:
    name: Deploy MedGemma → Dev
    needs: [changes, build-and-push-medgemma]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.changes.outputs.medgemma == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ needs.changes.outputs.gcp_wif_provider }}
          service_account: ${{ needs.changes.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy MedGemma service
        env:
          SERVICE: carditrack-dev-medgemma
          IMAGE: ${{ needs.build-and-push-medgemma.outputs.image }}
          REGION: ${{ needs.changes.outputs.gcp_region }}
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE \
            --region $REGION \
            --project $PROJECT \
            --quiet
      - name: Update MedGemma URL secret
        env:
          SERVICE: carditrack-dev-medgemma
          SECRET_ID: carditrack-dev-medgemma-service-url
          REGION: ${{ needs.changes.outputs.gcp_region }}
          PROJECT: ${{ needs.changes.outputs.gcp_project_id }}
        run: |
          URL=$(gcloud run services describe $SERVICE \
            --region $REGION \
            --project $PROJECT \
            --format='value(status.url)')
          echo -n "$URL" | gcloud secrets versions add $SECRET_ID \
            --data-file=- \
            --project $PROJECT

  # ── Main only: Create patch tag ──────────────────────────────────────────────
  patch-tag:
    name: Create Patch Tag
    needs:
      - changes
      - compute-version
      - deploy-api-dev
      - deploy-web-dev
      - deploy-worker-dev
      - deploy-medgemma-dev
      - upload-mobile-artifacts
      - deploy-testflight
      - deploy-play-internal
    permissions:
      contents: write
    if: |
      always() &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      contains(needs.*.result, 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tag
        env:
          TAG: ${{ needs.compute-version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $TAG
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git $TAG
          echo "### Tagged: \`$TAG\`" >> $GITHUB_STEP_SUMMARY
