name: Deploy Infrastructure → Common

# Dispatch-only: never runs on push or pull_request.
# See docs/technical/github_repository_access.md.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-common-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Shared config ────────────────────────────────────────────────────────────
  #
  # The root of the chain, and it carries no `if:`. A skipped job poisons everything
  # beneath it, past any `always()` in between — when the flag-reader that used to sit
  # here skipped on a dispatch, it took `validate` and the whole plan/apply chain with
  # it while the run still reported success. See the longer account in
  # deploy-apps-dev.yml, which failed the same way on 2026-08-15.
  env:
    uses: ./.github/workflows/_env.yml

  validate:
    name: Validate
    needs: env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ needs.env.outputs.tf_version }}
      - name: terraform fmt
        working-directory: ${{ needs.env.outputs.tf_working_dir_common }}
        run: terraform fmt -check -recursive
      - name: terraform init (no backend)
        working-directory: ${{ needs.env.outputs.tf_working_dir_common }}
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: ${{ needs.env.outputs.tf_working_dir_common }}
        run: terraform validate

  bootstrap-state-bucket:
    name: Bootstrap State Bucket
    needs: [env, validate]
    runs-on: ubuntu-latest
    outputs:
      bucket: ${{ steps.ensure.outputs.bucket }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ needs.env.outputs.gcp_wif_provider }}
          service_account: ${{ needs.env.outputs.gcp_service_account }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Ensure state bucket exists
        id: ensure
        env:
          BUCKET: ${{ needs.env.outputs.tf_state_bucket_common }}
          PROJECT: ${{ needs.env.outputs.gcp_project_id }}
          REGION: ${{ needs.env.outputs.gcp_region }}
        run: |
          if gcloud storage buckets describe gs://$BUCKET --project=$PROJECT > /dev/null 2>&1; then
            echo "Bucket gs://$BUCKET already exists"
          else
            echo "Bucket gs://$BUCKET not found — creating..."
            gcloud storage buckets create gs://$BUCKET \
              --project=$PROJECT \
              --location=$REGION \
              --uniform-bucket-level-access
            gcloud storage buckets update gs://$BUCKET --versioning
            echo "Bucket gs://$BUCKET created with versioning enabled"
          fi
          echo "bucket=${BUCKET}" >> $GITHUB_OUTPUT

  plan:
    name: Plan — ${{ matrix.tf_version }}
    needs: [env, validate, bootstrap-state-bucket]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tf_version:
          - ${{ needs.env.outputs.tf_version }}
          - latest
      fail-fast: false
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        if: matrix.tf_version == needs.env.outputs.tf_version
        with:
          workload_identity_provider: ${{ needs.env.outputs.gcp_wif_provider }}
          service_account: ${{ needs.env.outputs.gcp_service_account }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ matrix.tf_version }}
      - name: terraform init (pinned)
        if: matrix.tf_version == needs.env.outputs.tf_version
        working-directory: ${{ needs.env.outputs.tf_working_dir_common }}
        run: |
          terraform init \
            -backend-config="bucket=${{ needs.env.outputs.tf_state_bucket_common }}" \
            -backend-config="prefix=carditrack/common"
      - name: terraform init (latest, no backend)
        if: matrix.tf_version != needs.env.outputs.tf_version
        working-directory: ${{ needs.env.outputs.tf_working_dir_common }}
        run: terraform init -backend=false
      - name: terraform plan (pinned)
        if: matrix.tf_version == needs.env.outputs.tf_version
        id: plan-pinned
        working-directory: ${{ needs.env.outputs.tf_working_dir_common }}
        run: |
          set +e
          terraform plan \
            -var-file=../environments/common.tfvars \
            -out=common.tfplan \
            -detailed-exitcode \
            -no-color 2>&1 | tee plan.txt
          TF_EXIT=${PIPESTATUS[0]}
          echo "exitcode=${TF_EXIT}" >> $GITHUB_OUTPUT
          [ $TF_EXIT -eq 1 ] && exit 1 || exit 0
      - name: terraform validate (latest)
        if: matrix.tf_version != needs.env.outputs.tf_version
        working-directory: ${{ needs.env.outputs.tf_working_dir_common }}
        run: terraform validate -no-color 2>&1 | tee plan.txt
      - name: Save plan artifact
        if: matrix.tf_version == needs.env.outputs.tf_version
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: common-tfplan
          path: ${{ needs.env.outputs.tf_working_dir_common }}/common.tfplan
          retention-days: 1
      - name: Plan summary
        run: |
          echo "### Terraform Plan — Common (${{ matrix.tf_version }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat ${{ needs.env.outputs.tf_working_dir_common }}/plan.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  apply:
    name: Apply (Common)
    needs: [env, plan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ needs.env.outputs.gcp_wif_provider }}
          service_account: ${{ needs.env.outputs.gcp_service_account }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ needs.env.outputs.tf_version }}
      - name: terraform init
        working-directory: ${{ needs.env.outputs.tf_working_dir_common }}
        run: |
          terraform init \
            -backend-config="bucket=${{ needs.env.outputs.tf_state_bucket_common }}" \
            -backend-config="prefix=carditrack/common"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: common-tfplan
          path: ${{ needs.env.outputs.tf_working_dir_common }}
      - name: terraform apply
        working-directory: ${{ needs.env.outputs.tf_working_dir_common }}
        run: terraform apply common.tfplan
      - name: Output summary
        working-directory: ${{ needs.env.outputs.tf_working_dir_common }}
        run: |
          echo "### Terraform Applied — Common" >> $GITHUB_STEP_SUMMARY
          terraform output -no-color >> $GITHUB_STEP_SUMMARY

  # ── Did the manual run actually do anything? ────────────────────────────────
  #
  # A dispatch whose job graph collapses is indistinguishable from a successful one: everything
  # skips, and GitHub scores a run of nothing as a green tick. Every run is a dispatch now,
  # so the assertion applies unconditionally.
  dispatch-sanity:
    name: Dispatch ran something
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert the dispatch reached Terraform
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          if [ "${VALIDATE_RESULT}" != "success" ]; then
            echo "::error::Manual dispatch never reached Terraform — 'Validate' was ${VALIDATE_RESULT}, so plan and apply skipped. No infrastructure was changed."
            exit 1
          fi
