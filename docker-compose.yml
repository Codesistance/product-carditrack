services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: carditrack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carditrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: src/Presentation/CardiTrack.API/Dockerfile.migrate
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=carditrack;Username=postgres;Password=postgres"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_VULKAN=1
    devices:
      - /dev/dxg:/dev/dxg
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: ["full"]

  medgemma-init:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c", "OLLAMA_HOST=http://ollama:11434 ollama pull hf.co/unsloth/medgemma-1.5-4b-it-GGUF:Q4_K_M"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    profiles: ["full"]

  # Plain, non-medical model — rewrites MedGemma's clinical output into caregiver language
  # (docs/llm_design.md). Pulled into the same local Ollama instance as MedGemma, not a second
  # container, matching how the two are packaged into one image in prod.
  rewrite-init:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c", "OLLAMA_HOST=http://ollama:11434 ollama pull gemma3:4b-it-qat"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    profiles: ["full"]

  api:
    build:
      context: .
      dockerfile: src/Presentation/CardiTrack.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=carditrack;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      # Local-development key ONLY — a throwaway value committed alongside the local
      # postgres credentials so `docker compose up` works with no extra setup. Deployed
      # environments read the real key from Secret Manager (carditrack-<env>-encryption-key).
      Encryption__Key: "W2iqrS4VgOXDgwZQWCGj716pKcu2nLs1tk5j66oNzBY="
      # Public (off-estate) provider for reports and chat. Swap providers by changing Kind,
      # Model and ApiKey — Gemini and Anthropic are both supported without a rebuild.
      AI__Public__Kind: "Gemini"
      AI__Public__Model: "gemini-2.0-flash"
      # Placeholder, not blank: the public provider is validated at startup, and a blank key
      # would stop the API booting for everyone whose local work never touches chat or reports.
      # Left as-is, chat and reports get a 401 from the provider; insights still run against the
      # local Ollama below. Replace it with a real key to exercise the public path.
      AI__Public__ApiKey: "unset-local-placeholder"
      AI__Public__TimeoutSeconds: "60"
      # Private provider for medical insights — always MedGemma, in-project. Only its
      # location and weights are configurable.
      AI__Private__BaseUrl: "http://host.docker.internal:11434"
      AI__Private__Model: "hf.co/unsloth/medgemma-1.5-4b-it-GGUF:Q4_K_M"
      AI__Private__TimeoutSeconds: "120"
      # Rewrite provider — a plain non-medical model on the same local Ollama instance, used only
      # to rewrite MedGemma's clinical output into caregiver language. Same in-project guarantee
      # as Private; see rewrite-init above.
      AI__Rewrite__BaseUrl: "http://host.docker.internal:11434"
      AI__Rewrite__Model: "gemma3:4b-it-qat"
      AI__Rewrite__TimeoutSeconds: "120"
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    profiles: ["full"]

  worker:
    build:
      context: .
      dockerfile: src/Worker/CardiTrack.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=carditrack;Username=postgres;Password=postgres"
      ConnectionStrings__Redis: "redis:6379"
      # Must match the API's key — both encrypt/decrypt the same stored OAuth tokens.
      Encryption__Key: "W2iqrS4VgOXDgwZQWCGj716pKcu2nLs1tk5j66oNzBY="
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    profiles: ["full"]

volumes:
  ollama_data:
